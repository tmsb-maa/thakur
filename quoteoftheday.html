<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote of the Day - TMS Library</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF8C00">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }

  header, footer {
    background-color: #FF8C00;
    color: #000000;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    font-size: 16px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #backBtn {
    background: none;
    border: none;
    color: #000000;
    font-size: 26px;
    font-weight: bold;
    cursor: pointer;
    padding: 0 10px;
  }

  #headerTitle {
    flex: 1;
    text-align: center;
    font-size: 18px;
  }

  #logoutBtn {
    background-color: #FF0000;
    color: #FFFFFF;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    padding: 0;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  main {
    flex: 1;
    background-color: #FFFFFF;
    padding: 30px 20px;
  }

  #statusMsg {
    text-align: center;
    font-size: 16px;
    color: #FF8C00;
    font-weight: bold;
    margin-top: 60px;
  }

  #quoteContent {
    display: none;
    max-width: 700px;
    margin: 0 auto;
  }

    .quoteCard {
    background: #fff8f0;
    border: 1px solid #FFDDB0;
    border-radius: 12px;
    padding: 25px 15px;
    margin: 0 auto 20px auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    text-align: center;
    width: 100%;
    max-width: 700px;
  }

    .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px auto;
  }

  .quoteText {
    font-size: 32px;
    font-style: italic;
    margin-bottom: 10px;
    line-height: 1.4;
    text-align: left;
  }

  .quoteAuthor {
    font-size: 28px;
    font-weight: bold;
    color: #FF8C00;
    margin-bottom: 15px;
  }
  .quoteAuthorBn {
    font-size: 20px;
    font-weight: bold;
    color: #FF8C00;
    margin-top: -10px;
    margin-bottom: 15px;
  }
  .navRow {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .navBtn {
    background-color: #FF8C00;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
  }

  .navBtn:hover {
    background-color: #e67c00;
  }

  @media (max-width: 480px) {
    #headerTitle { font-size: 16px; }
    #logoutBtn { width: 34px; height: 34px; font-size: 17px; }
    .avatar { width: 90px; height: 90px; font-size: 30px; }
    .quoteText { font-size: 22px; }
    .quoteAuthor { font-size: 18px; }
  }
</style>
</head>
<body>

  <header>
    <button id="backBtn" onclick="history.back()">&#8592;</button>
    <h1 id="headerTitle">TMS Library</h1>
    <button id="logoutBtn" onclick="logoutUser()">⏻</button>
  </header>

  <main>
    <p id="statusMsg">Checking access...</p>
    <div id="quoteContent"></div>
  </main>

  <footer>
    <p>Completely private Library.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDqmiTPNCbx2Kd9PKZdaKYrm_tKdR7gqzc",
      authDomain: "tmsb-online-library.firebaseapp.com",
      projectId: "tmsb-online-library",
      storageBucket: "tmsb-online-library.firebasestorage.app",
      messagingSenderId: "305360233952",
      appId: "1:305360233952:web:3c92404970ac61c6143785"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let profileListener = null;
    let localSessionVersion = null;
    const personState = {};
    let quotesLoaded = false;

    function getDeviceId() {
      let id = localStorage.getItem('tmsb_device_id');
      if (!id) {
        id = 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
        localStorage.setItem('tmsb_device_id', id);
      }
      return id;
    }

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function logoutUser() {
      if (profileListener) {
        profileListener();
        profileListener = null;
      }
      auth.signOut();
    }

    function renderPerson(personId) {
      const state = personState[personId];
      const card = document.getElementById('card-' + personId);
      if (!state || !card) return;

      if (!state.quotes || state.quotes.length === 0) {
          card.innerHTML =
          '<img class="avatar" src="' + personId + '.png" alt="' + (state.name || '') + '">' +
          '<p class="quoteAuthor">' + (state.name || '') + '</p>' +
        (state.nameBengali ? '<p class="quoteAuthorBn">' + state.nameBengali + '</p>' : '') +
          '<p class="quoteText">No quotes added yet.</p>';
        return;
      }

      const total = state.quotes.length;
      let index = (state.baseIndex + state.manualOffset) % total;
      if (index < 0) index += total;

      const quoteText = state.quotes[index];

        card.innerHTML =
        '<img class="avatar" src="' + personId + '.png" alt="' + (state.name || '') + '">' +
        '<p class="quoteText">&ldquo;' + quoteText + '&rdquo;</p>' +
        '<p class="quoteAuthor">' + (state.name || '') + '</p>' +
        (state.nameBengali ? '<p class="quoteAuthorBn">' + state.nameBengali + '</p>' : '') +
        '<div class="navRow">' +
        '<button class="navBtn" onclick="navPerson(\'' + personId + '\', -1)">&#8592;</button>' +
        '<button class="navBtn" onclick="navPerson(\'' + personId + '\', 1)">&#8594;</button>' +
        '</div>';
    }

    function navPerson(personId, direction) {
      const state = personState[personId];
      if (!state || !state.quotes || state.quotes.length === 0) return;
      state.manualOffset += direction;
      renderPerson(personId);
    }

        async function loadQuotesFromJson() {
      const container = document.getElementById('quoteContent');
      container.innerHTML = '';

      const personFiles = [
        { key: 'thakursriramakrishna', file: 'thakursriramakrishna.json' },
        { key: 'srimaasarada', file: 'srimaasarada.json' },
        { key: 'swamivivekananda', file: 'swamivivekananda.json' }
      ];

      const deviceId = getDeviceId();
      const deviceHash = hashString(deviceId);

      for (const p of personFiles) {
        const card = document.createElement('div');
        card.className = 'quoteCard';
        card.id = 'card-' + p.key;
        container.appendChild(card);

        let personData;
        try {
          const response = await fetch(p.file + '?t=' + Date.now());
          personData = await response.json();
        } catch (e) {
          card.innerHTML = '<p style="text-align:center; color:#888;">Quotes not available for this person right now.</p>';
          continue;
        }

        const quotes = personData.quotes || [];
        const intervalHours = personData.rotationHours || 24;
        const timeSlot = Math.floor(Date.now() / (intervalHours * 3600000));

          personState[p.key] = {
          name: personData.name || '',
          nameBengali: personData.nameBengali || '',
          initials: personData.initials || '',
          quotes: quotes,
          baseIndex: quotes.length > 0 ? ((timeSlot + deviceHash) % quotes.length) : 0,
          manualOffset: 0
        };

        renderPerson(p.key);
      }

      quotesLoaded = true;
    }

    auth.onAuthStateChanged(function(user) {
      const statusMsg = document.getElementById('statusMsg');
      const quoteContent = document.getElementById('quoteContent');

      if (profileListener) {
        profileListener();
        profileListener = null;
      }

      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      profileListener = db.collection("users").doc(user.uid).onSnapshot(function(doc) {
        if (!doc.exists) {
          auth.signOut();
          window.location.href = 'index.html';
          return;
        }
        const data = doc.data();
        const today = new Date().toISOString().split('T')[0];

        if (!data.approved) {
          auth.signOut();
          window.location.href = 'index.html';
          return;
        }
        if (data.blocked) {
          auth.signOut();
          window.location.href = 'index.html';
          return;
        }
        if (data.accessStart && today < data.accessStart) {
          auth.signOut();
          window.location.href = 'index.html';
          return;
        }
        if (data.accessEnd && today > data.accessEnd) {
          auth.signOut();
          window.location.href = 'index.html';
          return;
        }

        if (localSessionVersion === null) {
          localSessionVersion = data.sessionVersion || 0;
        } else if (data.sessionVersion !== localSessionVersion) {
          auth.signOut();
          window.location.href = 'index.html';
          return;
        }

        const deviceId = getDeviceId();
        const devices = data.devices || [];

        if (!devices.includes(deviceId)) {
          if (devices.length >= (data.maxDevices || 1)) {
            auth.signOut();
            window.location.href = 'index.html';
            return;
          }
          db.collection("users").doc(user.uid).update({
            devices: firebase.firestore.FieldValue.arrayUnion(deviceId)
          });
        }

        statusMsg.style.display = 'none';
        quoteContent.style.display = 'block';

        if (!quotesLoaded) {
          loadQuotesFromJson();
        }
      });
    });
  </script>

</body>
</html>
