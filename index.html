<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMSB Education</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF8C00">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }

  header, footer {
    background-color: #FF8C00;
    color: #000000;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    font-size: 16px;
  }

  main {
       position: relative;
    flex: 1;
    background-color: #FFFFFF;
    padding: 30px;
    text-align: center;
  }

  main h2 {
    font-size: 22px;
    padding: 0 10px;
    margin-bottom: 20px;
  }
   #logoutBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background-color: #FF0000;
    color: #FFFFFF;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    font-size: 20px;
    cursor: pointer;
    margin-bottom: 15px;
  }
   @media (max-width: 480px) {
    header h1 { font-size: 20px; }
    main h2 { font-size: 18px; }
    #logoutBtn {
      width: 38px;
      height: 38px;
      font-size: 16px;
      top: 12px;
      right: 12px;
    }
    footer p { font-size: 13px; }
  }
</style>
</head>
<body>

  <header>
    <h1>TMSB Education</h1>
  </header>

  <main>
   <div id="authBox">
  <h3>Login / Sign Up</h3>
  <input type="email" id="emailInput" placeholder="Email"><br><br>
  <input type="password" id="passwordInput" placeholder="Password"><br><br>
  <button onclick="signupUser()">Sign Up</button>
  <button onclick="loginUser()">Login</button>
  <p id="authError" style="color:red;"></p>
</div>
   <button id="logoutBtn" onclick="logoutUser()">⏻</button>
    <h2 id="welcomeText">Welcome to the TMSB Library</h2>
    <!-- Tabs will go here -->
  </main>

  <footer>
    <p>Completely private and not for resale</p>
  </footer>

 <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDqmiTPNCbx2Kd9PKZdaKYrm_tKdR7gqzc",
    authDomain: "tmsb-online-library.firebaseapp.com",
    projectId: "tmsb-online-library",
    storageBucket: "tmsb-online-library.firebasestorage.app",
    messagingSenderId: "305360233952",
    appId: "1:305360233952:web:3c92404970ac61c6143785"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
</script>
 <script>
        function signupUser() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      auth.createUserWithEmailAndPassword(email, password)
        .catch((error) => {
          document.getElementById('authError').innerText = error.message;
        });
    }

    function loginUser() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      auth.signInWithEmailAndPassword(email, password)
        .catch((error) => {
          document.getElementById('authError').innerText = error.message;
        });
    }

    function logoutUser() {
      auth.signOut();
    }

    auth.onAuthStateChanged((user) => {
      const authBox = document.getElementById('authBox');
      const logoutBtn = document.getElementById('logoutBtn');
      const welcomeText = document.getElementById('welcomeText');
      if (user) {
        authBox.style.display = 'none';
        logoutBtn.style.display = 'block';
        welcomeText.style.display = 'block';
      } else {
        authBox.style.display = 'block';
        logoutBtn.style.display = 'none';
        welcomeText.style.display = 'none';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=2');
      });
    }
  </script>

</body>
</html>
