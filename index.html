<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMSB Education</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF8C00">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }

  header, footer {
    background-color: #FF8C00;
    color: #000000;
    font-weight: bold;
    text-align: center;
    padding: 20px;
  }

  main {
    flex: 1;
    background-color: #FFFFFF;
    padding: 30px;
    text-align: center;
  }

  main h2 {
    margin-bottom: 20px;
  }
</style>
</head>
<body>

  <header>
    <h1>TMSB Education</h1>
  </header>

  <main>
    <h2>Welcome to the TMSB Library</h2>
    <!-- Tabs will go here -->
  </main>

  <footer>
    <p>Completely private and not for resale</p>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>

</body>
</html>
