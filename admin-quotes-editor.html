<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS Quotes Editor (Offline)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }

  header {
    background-color: #FF8C00;
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    font-size: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .topBar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
    align-items: center;
  }

  .topBar input[type="file"] { flex: 1; min-width: 200px; }

  button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }

  .btnPrimary { background-color: #FF8C00; color: #fff; }
  .btnGreen { background-color: #4CAF50; color: #fff; }
  .btnRed { background-color: #e53935; color: #fff; }
  .btnGray { background-color: #757575; color: #fff; }

  #personsContainer { display: flex; flex-direction: column; gap: 20px; }

  .personBlock {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
  }

  .personHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .personHeader input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    margin-right: 8px;
  }

  .quoteRow {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .quoteRow textarea {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    min-height: 50px;
    resize: vertical;
  }

  #addPersonBtn { margin-top: 15px; }

  .statusMsg {
    text-align: center;
    padding: 10px;
    font-weight: bold;
    color: green;
  }

  .filenamePreview {
    font-size: 13px;
    color: #888;
    margin-top: 6px;
  }
</style>
</head>
<body>

  <header>TMS Quotes Editor &mdash; Offline Tool</header>

  <div class="topBar">
    <button class="btnGray" onclick="document.getElementById('importFile').click()">Import person's json</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJson(event)">
    <button class="btnGreen" onclick="exportJson()">Export / Save json</button>
    <button class="btnRed" onclick="clearAll()">Clear Everything</button>
  </div>

  <p id="statusMsg" class="statusMsg"></p>

  <div id="personsContainer"></div>

  <button id="addPersonBtn" class="btnPrimary" onclick="addPerson()">+ Add New Person</button>

  <script>
    let person = null; // null = nothing added yet; otherwise { name, initials, quotes: [] }

    function saveDraft() {
      if (person) {
        localStorage.setItem('tms_quotes_draft', JSON.stringify(person));
      } else {
        localStorage.removeItem('tms_quotes_draft');
      }
    }

    function loadDraft() {
      const saved = localStorage.getItem('tms_quotes_draft');
      if (saved) {
        try {
          person = JSON.parse(saved);
        } catch (e) {
          person = null;
        }
      }
      render();
    }

    function makeFilename(name) {
      return (name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render() {
      const container = document.getElementById('personsContainer');
      const addBtn = document.getElementById('addPersonBtn');
      container.innerHTML = '';

      if (!person) {
        addBtn.style.display = 'inline-block';
        return;
      }

      addBtn.style.display = 'none';

      const block = document.createElement('div');
      block.className = 'personBlock';

      let html = '<div class="personHeader">' +
        '<div>' +
        '<input type="text" placeholder="Full Name" value="' + escapeHtml(person.name) + '" onchange="updatePersonField(\'name\', this.value)">' +
        '<input type="text" placeholder="Name in Bengali (optional)" value="' + escapeHtml(person.nameBengali || '') + '" onchange="updatePersonField(\'nameBengali\', this.value)" style="margin-top:6px; display:block;">' +
        '<input type="text" placeholder="Initials" maxlength="3" value="' + escapeHtml(person.initials) + '" onchange="updatePersonField(\'initials\', this.value)" style="width:60px;">' +
        '</div>' +
        '<button class="btnRed" onclick="removePerson()">Remove Person</button>' +
        '</div>';

      html += '<div class="filenamePreview">Will save as: ' + (makeFilename(person.name) || '(type a name first)') + '.json</div>';

      html += '<div id="quotesList" style="margin-top:12px;">';
      person.quotes.forEach(function(q, qIndex) {
        html += '<div class="quoteRow">' +
          '<textarea onchange="updateQuote(' + qIndex + ', this.value)">' + escapeHtml(q) + '</textarea>' +
          '<button class="btnRed" onclick="removeQuote(' + qIndex + ')">Delete</button>' +
          '</div>';
      });
      html += '</div>';

      html += '<button class="btnGreen" onclick="addQuote()">+ Add Quote</button>' +
        '<span style="margin-left:10px; color:#888; font-size:13px;">' + person.quotes.length + ' quote(s)</span>';

      block.innerHTML = html;
      container.appendChild(block);
    }

    function addPerson() {
      person = { name: '', initials: '', quotes: [] };
      saveDraft();
      render();
    }

    function removePerson() {
      if (confirm('Remove this person and all their quotes from the editor? (This does not delete anything already uploaded to GitHub.)')) {
        person = null;
        saveDraft();
        render();
      }
    }

    function updatePersonField(field, value) {
      person[field] = value;
      saveDraft();
      render();
    }

    function addQuote() {
      person.quotes.push('');
      saveDraft();
      render();
    }

    function updateQuote(qIndex, value) {
      person.quotes[qIndex] = value;
      saveDraft();
    }

    function removeQuote(qIndex) {
      person.quotes.splice(qIndex, 1);
      saveDraft();
      render();
    }

    function exportJson() {
      if (!person) {
        alert('Add or import a person first.');
        return;
      }
      const filename = makeFilename(person.name);
      if (!filename) {
        alert('Please type the name first.');
        return;
      }

      const blob = new Blob([JSON.stringify(person, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const status = document.getElementById('statusMsg');
      status.innerText = filename + '.json downloaded! Now upload this file to your GitHub repo.';
      setTimeout(function() { status.innerText = ''; }, 5000);
    }

    function importJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          person = {
            name: imported.name || '',
            initials: imported.initials || '',
            quotes: imported.quotes || []
          };
          saveDraft();
          render();
          const status = document.getElementById('statusMsg');
          status.innerText = 'Imported successfully! You can continue editing.';
          setTimeout(function() { status.innerText = ''; }, 4000);
        } catch (err) {
          alert('Could not read this file. Please make sure it is a valid person json file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearAll() {
      if (confirm('This will erase everything currently in the editor (not any file already uploaded to GitHub). Continue?')) {
        person = null;
        localStorage.removeItem('tms_quotes_draft');
        render();
      }
    }

    loadDraft();
  </script>

</body>
</html>
