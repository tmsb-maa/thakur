<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS Quotes Editor (Offline)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }

  header {
    background-color: #FF8C00;
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    font-size: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .topBar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
    align-items: center;
  }

  .topBar input[type="file"] { flex: 1; min-width: 200px; }

  button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }

  .btnPrimary { background-color: #FF8C00; color: #fff; }
  .btnGreen { background-color: #4CAF50; color: #fff; }
  .btnRed { background-color: #e53935; color: #fff; }
  .btnGray { background-color: #757575; color: #fff; }

  .rotationBox {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rotationBox input { width: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }

  #personsContainer { display: flex; flex-direction: column; gap: 20px; }

  .personBlock {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
  }

  .personHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .personHeader input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    margin-right: 8px;
  }

  .quoteRow {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .quoteRow textarea {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    min-height: 50px;
    resize: vertical;
  }

  #addPersonBtn { margin-top: 15px; }

  .statusMsg {
    text-align: center;
    padding: 10px;
    font-weight: bold;
    color: green;
  }
</style>
</head>
<body>

  <header>TMS Quotes Editor &mdash; Offline Tool</header>

  <div class="topBar">
    <button class="btnGray" onclick="document.getElementById('importFile').click()">Import quotes.json</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJson(event)">
    <button class="btnGreen" onclick="exportJson()">Export / Save quotes.json</button>
    <button class="btnRed" onclick="clearAll()">Clear Everything</button>
  </div>

  <p id="statusMsg" class="statusMsg"></p>

  <div class="rotationBox">
    <label><b>Rotation interval (hours, 1&ndash;24):</b></label>
    <input type="number" id="rotationHours" min="1" max="24" value="24" onchange="saveDraft()">
  </div>

  <div id="personsContainer"></div>

  <button id="addPersonBtn" class="btnPrimary" onclick="addPerson()">+ Add New Person</button>

  <script>
    let data = { rotationHours: 24, persons: [] };

    function uid() {
      return 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    }

    function saveDraft() {
      data.rotationHours = parseInt(document.getElementById('rotationHours').value) || 24;
      localStorage.setItem('tms_quotes_draft', JSON.stringify(data));
    }

    function loadDraft() {
      const saved = localStorage.getItem('tms_quotes_draft');
      if (saved) {
        try {
          data = JSON.parse(saved);
        } catch (e) {
          data = { rotationHours: 24, persons: [] };
        }
      }
      if (!data.persons) data.persons = [];
      if (!data.rotationHours) data.rotationHours = 24;
      document.getElementById('rotationHours').value = data.rotationHours;
      render();
    }

    function render() {
      const container = document.getElementById('personsContainer');
      container.innerHTML = '';

      data.persons.forEach(function(person, pIndex) {
        const block = document.createElement('div');
        block.className = 'personBlock';

        let html = '<div class="personHeader">' +
          '<div>' +
          '<input type="text" placeholder="Full Name" value="' + escapeHtml(person.name) + '" onchange="updatePersonField(' + pIndex + ', \'name\', this.value)">' +
          '<input type="text" placeholder="Initials" maxlength="3" value="' + escapeHtml(person.initials) + '" onchange="updatePersonField(' + pIndex + ', \'initials\', this.value)" style="width:60px;">' +
          '</div>' +
          '<button class="btnRed" onclick="removePerson(' + pIndex + ')">Remove Person</button>' +
          '</div>';

        html += '<div id="quotes-' + pIndex + '">';
        person.quotes.forEach(function(q, qIndex) {
          html += '<div class="quoteRow">' +
            '<textarea onchange="updateQuote(' + pIndex + ', ' + qIndex + ', this.value)">' + escapeHtml(q) + '</textarea>' +
            '<button class="btnRed" onclick="removeQuote(' + pIndex + ', ' + qIndex + ')">Delete</button>' +
            '</div>';
        });
        html += '</div>';

        html += '<button class="btnGreen" onclick="addQuote(' + pIndex + ')">+ Add Quote</button>' +
          '<span style="margin-left:10px; color:#888; font-size:13px;">' + person.quotes.length + ' quote(s)</span>';

        block.innerHTML = html;
        container.appendChild(block);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function addPerson() {
      data.persons.push({ id: uid(), name: '', initials: '', quotes: [] });
      saveDraft();
      render();
    }

    function removePerson(pIndex) {
      if (confirm('Remove this person and all their quotes?')) {
        data.persons.splice(pIndex, 1);
        saveDraft();
        render();
      }
    }

    function updatePersonField(pIndex, field, value) {
      data.persons[pIndex][field] = value;
      saveDraft();
    }

    function addQuote(pIndex) {
      data.persons[pIndex].quotes.push('');
      saveDraft();
      render();
    }

    function updateQuote(pIndex, qIndex, value) {
      data.persons[pIndex].quotes[qIndex] = value;
      saveDraft();
    }

    function removeQuote(pIndex, qIndex) {
      data.persons[pIndex].quotes.splice(qIndex, 1);
      saveDraft();
      render();
    }

    function exportJson() {
      data.rotationHours = parseInt(document.getElementById('rotationHours').value) || 24;
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'quotes.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const status = document.getElementById('statusMsg');
      status.innerText = 'quotes.json downloaded! Now upload this file to your GitHub repo.';
      setTimeout(function() { status.innerText = ''; }, 5000);
    }

    function importJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported.persons) imported.persons = [];
          if (!imported.rotationHours) imported.rotationHours = 24;
          data = imported;
          document.getElementById('rotationHours').value = data.rotationHours;
          saveDraft();
          render();
          const status = document.getElementById('statusMsg');
          status.innerText = 'Imported successfully! You can continue editing.';
          setTimeout(function() { status.innerText = ''; }, 4000);
        } catch (err) {
          alert('Could not read this file. Please make sure it is a valid quotes.json file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearAll() {
      if (confirm('This will erase everything currently in the editor (not any file already uploaded to GitHub). Continue?')) {
        data = { rotationHours: 24, persons: [] };
        localStorage.removeItem('tms_quotes_draft');
        document.getElementById('rotationHours').value = 24;
        render();
      }
    }

    loadDraft();
  </script>

</body>
</html>
