<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4:5 Photo Cropper</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #eee;
            margin-top: 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .upload-area {
            margin-bottom: 25px;
        }

        #fileInput {
            display: none;
        }

        .browse-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(76,175,80,0.3);
            transition: 0.3s;
            font-weight: 500;
        }

        .browse-btn:hover {
            background: #66bb6a;
            transform: scale(1.03);
        }

        .browse-btn:active {
            transform: scale(0.96);
        }

        .canvas-wrapper {
            position: relative;
            display: inline-block;
            background: #111;
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
            box-shadow: inset 0 0 0 1px #444;
            touch-action: none; /* prevent scroll while dragging */
        }

        #imageCanvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            cursor: grab;
            background: #222;
            touch-action: none;
        }

        #imageCanvas:active {
            cursor: grabbing;
        }

        .frame-overlay {
            position: absolute;
            border: 3px solid #00ff88;
            box-shadow: 0 0 0 2px rgba(0,255,136,0.3), 0 0 20px rgba(0,255,136,0.2);
            pointer-events: none; /* so we can drag the image underneath */
            border-radius: 4px;
            background: rgba(0,255,136,0.03);
            /* size & position set by JS */
        }

        .zoom-controls {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }

        .zoom-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #00ff88;
            color: #000;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,255,136,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: 0.2s;
        }

        .zoom-btn:hover {
            background: #33ffaa;
            transform: scale(1.08);
        }

        .zoom-btn:active {
            transform: scale(0.92);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0 10px;
            color: #ccc;
            font-size: 14px;
        }

        .info-row span {
            background: #2a2a2a;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #3a3a3a;
        }

        .action-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 18px 0 5px;
        }

        .btn {
            background: #3a3a3a;
            color: #ddd;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            min-width: 130px;
        }

        .btn-primary {
            background: #2196F3;
            color: white;
            box-shadow: 0 4px 12px rgba(33,150,243,0.3);
        }

        .btn-primary:hover {
            background: #42a5f5;
            transform: scale(1.02);
        }

        .btn-success {
            background: #4CAF50;
            color: white;
            box-shadow: 0 4px 12px rgba(76,175,80,0.3);
        }

        .btn-success:hover {
            background: #66bb6a;
            transform: scale(1.02);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
            box-shadow: 0 4px 12px rgba(231,76,60,0.3);
        }

        .btn-danger:hover {
            background: #ef5350;
            transform: scale(1.02);
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: none;
        }

        .status {
            color: #aaa;
            font-size: 14px;
            margin-top: 15px;
            border-top: 1px solid #333;
            padding-top: 15px;
            word-break: break-all;
        }

        .status a {
            color: #4fc3f7;
            text-decoration: none;
        }

        .status a:hover {
            text-decoration: underline;
        }

        .ratio-badge {
            background: #00ff88;
            color: #000;
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .size-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0 0 20px;
        }

        .size-btn {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #3a3a3a;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .size-btn:hover {
            border-color: #00ff88;
            color: #fff;
        }

        .size-btn.active {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        .filesize-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 0 20px;
        }

        .filesize-row input:focus {
            outline: none;
            border-color: #00ff88;
        }

        /* responsive */
        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }
            .action-buttons .btn {
                min-width: 100px;
                padding: 10px 18px;
                font-size: 14px;
            }
            .info-row {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📷 4:5 Crop Tool</h2>
    <p style="color:#888; margin-top:-8px; margin-bottom:12px;">
        <span class="ratio-badge" id="ratioBadge">1.5″ × 1.875″ (4:5)</span> &nbsp; green frame
    </p>

    <div class="size-selector" id="sizeSelector">
        <button class="size-btn active" data-w="1.5" data-h="1.875">1.5″ × 1.875″</button>
        <button class="size-btn" data-w="3" data-h="3.75">3″ × 3.75″</button>
        <button class="size-btn" data-w="4" data-h="5">4″ × 5″</button>
        <button class="size-btn" data-w="6" data-h="7.5">6″ × 7.5″</button>
        <button class="size-btn" data-w="8" data-h="10">8″ × 10″</button>
    </div>

    <div class="filesize-row" id="filesizeRow">
        <label for="targetKbInput" style="color:#ccc; font-size:14px;">🎯 Target file size (KB):</label>
        <input type="number" id="targetKbInput" placeholder="e.g. 400" min="10" step="10"
               style="width:100px; padding:6px 10px; border-radius:20px; border:1px solid #3a3a3a; background:#2a2a2a; color:#eee;">
    </div>

    <div class="upload-area">
        <input type="file" id="fileInput" accept="image/*" />
        <button class="browse-btn" id="browseBtn">📂 Browse Image</button>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="imageCanvas" width="600" height="500"></canvas>
        <div class="frame-overlay" id="frameOverlay"></div>
        <div class="zoom-controls" id="zoomControls">
            <button class="zoom-btn" id="zoomInBtn" title="Zoom in">+</button>
            <button class="zoom-btn" id="zoomOutBtn" title="Zoom out">−</button>
        </div>
    </div>

    <div class="info-row">
        <span>🖱️ Drag image to reposition</span>
        <span id="sizeInfo">0 × 0 px</span>
        <span id="frameInfo">Frame: 4:5</span>
    </div>

    <div class="action-buttons">
        <button class="btn btn-danger" id="resetBtn" disabled>↺ Reset</button>
        <button class="btn" id="rotateBtn" disabled>⟳ Rotate</button>
        <button class="btn" id="orientationBtn" disabled>⇄ Orientation</button>
        <button class="btn btn-primary" id="cropBtn" disabled>✂️ Crop</button>
        <button class="btn btn-success" id="downloadBtn" disabled>💾 Save as PNG</button>
    </div>

    <div class="status" id="status">
        ⚡ Load an image to begin.
    </div>
</div>

<script>
    (function() {
        // ----- DOM refs -----
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        const frameOverlay = document.getElementById('frameOverlay');
        const wrapper = document.getElementById('canvasWrapper');
        const zoomControls = document.getElementById('zoomControls');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const rotateBtn = document.getElementById('rotateBtn');
        const orientationBtn = document.getElementById('orientationBtn');
        const sizeSelector = document.getElementById('sizeSelector');
        const ratioBadge = document.getElementById('ratioBadge');
        const targetKbInput = document.getElementById('targetKbInput');
        const resetBtn = document.getElementById('resetBtn');
        const cropBtn = document.getElementById('cropBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const sizeInfo = document.getElementById('sizeInfo');
        const frameInfo = document.getElementById('frameInfo');

        // ----- State -----
        let originalImage = null;          // the loaded Image object
        let imgX = 0, imgY = 0;            // top-left corner of image in canvas coords
        let imgScale = 1;                  // scale factor (canvas size / natural size)
        let imgRotation = 0;               // rotation in degrees (0/90/180/270)
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let dragStartImgX = 0, dragStartImgY = 0;
        let canvasWidth = 600, canvasHeight = 500; // will be updated

        // Frame ratio = 4:5  (width:height), toggled by orientation button
        let FRAME_RATIO = 4 / 5; // 0.8
        let isPortrait = true;
        // We'll compute frame size based on canvas size, keeping ratio.

        // ----- Output (export) resolution -----
        // All presets keep the exact 4:5 ratio; only physical size changes.
        const OUTPUT_DPI = 300; // try 150 (web/screen), 300 (print), 600 (very high-res)
        let OUTPUT_WIDTH_IN = 1.5;
        let OUTPUT_HEIGHT_IN = 1.875;

               // ----- Iteratively downscale a PNG until it's under the target byte size -----
        // (PNG is lossless, so shrinking pixel dimensions is the only reliable lever.)
        async function compressPngToTarget(sourceCanvas, targetBytes) {
            let scale = 1.0;
            let workCanvas = sourceCanvas;
            let blob = await new Promise(res => workCanvas.toBlob(res, 'image/png'));

            if (!targetBytes || blob.size <= targetBytes) {
                return { blob, canvas: workCanvas, scale: 1.0, hitTarget: true };
            }

            const minScale = 0.15; // safety floor so it never collapses to nothing
            while (blob.size > targetBytes && scale > minScale) {
                scale -= 0.05;
                const w = Math.max(1, Math.round(sourceCanvas.width * scale));
                const h = Math.max(1, Math.round(sourceCanvas.height * scale));
                const tmp = document.createElement('canvas');
                tmp.width = w;
                tmp.height = h;
                const tctx = tmp.getContext('2d');
                tctx.imageSmoothingEnabled = true;
                tctx.imageSmoothingQuality = 'high';
                tctx.drawImage(sourceCanvas, 0, 0, w, h);
                blob = await new Promise(res => tmp.toBlob(res, 'image/png'));
                workCanvas = tmp;
            }

            return { blob, canvas: workCanvas, scale, hitTarget: blob.size <= targetBytes };
        }

        // ----- Embed real DPI metadata into a PNG so Photoshop shows correct inches -----
        function crc32(buf) {
            let table = crc32._table;
            if (!table) {
                table = crc32._table = [];
                for (let n = 0; n < 256; n++) {
                    let c = n;
                    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                    table[n] = c;
                }
            }
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function buildPhysChunk(dpi) {
            const ppm = Math.round(dpi / 0.0254); // pixels per meter
            const body = new Uint8Array(4 + 9); // 'pHYs' + 9 bytes data
            const dv = new DataView(body.buffer);
            body.set([0x70, 0x48, 0x59, 0x73], 0); // "pHYs"
            dv.setUint32(4, ppm);
            dv.setUint32(8, ppm);
            body[12] = 1; // unit: meters
            const crc = crc32(body);
            const chunk = new Uint8Array(4 + body.length + 4);
            const cdv = new DataView(chunk.buffer);
            cdv.setUint32(0, 9); // data length
            chunk.set(body, 4);
            cdv.setUint32(4 + body.length, crc);
            return chunk;
        }

        async function addDpiToPngBlob(blob, dpi) {
            const buf = new Uint8Array(await blob.arrayBuffer());
            const ihdrEnd = 8 + 4 + 4 + 13 + 4; // signature + IHDR chunk
            const phys = buildPhysChunk(dpi);
            const out = new Uint8Array(buf.length + phys.length);
            out.set(buf.subarray(0, ihdrEnd), 0);
            out.set(phys, ihdrEnd);
            out.set(buf.subarray(ihdrEnd), ihdrEnd + phys.length);
            return new Blob([out], { type: 'image/png' });
        }

        // ----- Handle size preset button clicks -----
        function selectSize(btn) {
            const w = parseFloat(btn.dataset.w);
            const h = parseFloat(btn.dataset.h);
            OUTPUT_WIDTH_IN = w;
            OUTPUT_HEIGHT_IN = h;

            sizeSelector.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            ratioBadge.textContent = `${w}″ × ${h}″ (4:5)`;

            statusDiv.innerHTML = `📐 Output size set to ${w}″ × ${h}″ (4:5). Frame ratio unchanged.`;
        }

        // ----- Helper: update frame overlay size & position -----
        function updateFrameOverlay() {
            const w = canvas.width;
            const h = canvas.height;
            // We want the frame to be as large as possible while maintaining 4:5
            // and fitting inside canvas.
            let frameW, frameH;
            // try width first
            frameW = w * 0.92;   // leave some margin
            frameH = frameW / FRAME_RATIO; // since ratio = w/h => h = w/ratio
            if (frameH > h * 0.92) {
                // if height exceeds, use height as constraint
                frameH = h * 0.92;
                frameW = frameH * FRAME_RATIO;
            }
            // ensure integer pixels for crispness
            frameW = Math.floor(frameW);
            frameH = Math.floor(frameH);

            // center the frame
            const left = (w - frameW) / 2;
            const top = (h - frameH) / 2;

            frameOverlay.style.width = frameW + 'px';
            frameOverlay.style.height = frameH + 'px';
            frameOverlay.style.left = left + 'px';
            frameOverlay.style.top = top + 'px';

            // store frame geometry on canvas for later crop
            canvas._frame = { x: left, y: top, w: frameW, h: frameH };

            // update frame info
            frameInfo.textContent = `Frame: ${frameW}×${frameH} px (${isPortrait ? '4:5' : '5:4'})`;

            updateZoomControlsPosition();
        }

        // ----- Position zoom +/- buttons vertically along the frame's right edge -----
        function updateZoomControlsPosition() {
            const frame = canvas._frame;
            if (!frame) return;
            const left = frame.x + frame.w + 14; // gap to the right of the green box
            const top = frame.y + frame.h / 2 - 38; // vertically centered on the frame
            zoomControls.style.left = left + 'px';
            zoomControls.style.top = top + 'px';
        }

        // ----- Zoom in/out, keeping the canvas center fixed -----
        function zoomImage(factor) {
            if (!originalImage) return;
            const cx = canvas.width / 2, cy = canvas.height / 2;
            const oldScale = imgScale;
            let newScale = Math.max(0.05, Math.min(oldScale * factor, 10));
            const relX = (cx - imgX) / oldScale;
            const relY = (cy - imgY) / oldScale;
            imgX = cx - relX * newScale;
            imgY = cy - relY * newScale;
            imgScale = newScale;
            redraw();
        }

        // ----- Rotate image 90° clockwise -----
        function rotateImage() {
            if (!originalImage) return;
            imgRotation = (imgRotation + 90) % 360;
            redraw();
        }

        // ----- Toggle frame between portrait (4:5) and landscape (5:4) -----
        function toggleOrientation() {
            isPortrait = !isPortrait;
            FRAME_RATIO = isPortrait ? 4 / 5 : 5 / 4;
            updateFrameOverlay();
            statusDiv.innerHTML = isPortrait ? '📐 Frame set to Portrait (4:5).' : '📐 Frame set to Landscape (5:4).';
        }

        // ----- Redraw canvas (with current image position/scale) -----
        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!originalImage) {
                // draw a subtle placeholder
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#555';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Load an image to start', canvas.width/2, canvas.height/2);
                return;
            }

            // Draw the image with current position, scale, and rotation
            const dispW = originalImage.width * imgScale;
            const dispH = originalImage.height * imgScale;
            const cx = imgX + dispW / 2;
            const cy = imgY + dispH / 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(imgRotation * Math.PI / 180);
            ctx.drawImage(originalImage, -dispW / 2, -dispH / 2, dispW, dispH);
            ctx.restore();

            // update size info
            sizeInfo.textContent = `${Math.round(dispW)} × ${Math.round(dispH)} px (displayed)`;

            // frame overlay is updated separately via CSS, but we ensure it's on top
        }

        // ----- Fit image into canvas (centered, maintain aspect) -----
        function fitImageToCanvas() {
            if (!originalImage) return;

            imgRotation = 0;
            const natW = originalImage.width;
            const natH = originalImage.height;
            const cW = canvas.width;
            const cH = canvas.height;

            // scale so that image fits entirely in canvas (preserve aspect)
            const scaleX = cW / natW;
            const scaleY = cH / natH;
            imgScale = Math.min(scaleX, scaleY) * 0.92; // leave some margin for frame

            const dispW = natW * imgScale;
            const dispH = natH * imgScale;

            // center it
            imgX = (cW - dispW) / 2;
            imgY = (cH - dispH) / 2;

            redraw();
            updateFrameOverlay();
            enableButtons(true);
            statusDiv.innerHTML = '✅ Image loaded. Drag to position, then click <strong>Crop</strong>.';
        }

        // ----- Load image from file -----
        function loadImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                statusDiv.innerHTML = '⚠️ Please select a valid image file.';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    fitImageToCanvas();
                    // reset drag state
                    isDragging = false;
                    resetBtn.disabled = false;
                    cropBtn.disabled = false;
                    downloadBtn.disabled = true; // only after crop
                    statusDiv.innerHTML = `📸 Loaded: ${file.name} (${img.width}×${img.height})`;
                };
                img.onerror = function() {
                    statusDiv.innerHTML = '❌ Failed to decode image. Try another file.';
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                statusDiv.innerHTML = '❌ Error reading file.';
            };
            reader.readAsDataURL(file);
        }

        // ----- Enable/disable buttons -----
        function enableButtons(enabled) {
            const btns = [resetBtn, cropBtn, rotateBtn, orientationBtn];
            btns.forEach(b => b.disabled = !enabled);
            if (!enabled) {
                downloadBtn.disabled = true;
            }
        }

        // ----- Reset position (fit again) -----
        function resetPosition() {
            if (originalImage) {
                fitImageToCanvas();
                statusDiv.innerHTML = '↺ Position reset to center.';
            }
        }

        // ----- Build a full-resolution canvas with rotation baked in -----
        function getRotatedSourceCanvas() {
            const natW = originalImage.width;
            const natH = originalImage.height;
            const swapped = (imgRotation % 180) !== 0; // 90 or 270
            const rotW = swapped ? natH : natW;
            const rotH = swapped ? natW : natH;

            const rc = document.createElement('canvas');
            rc.width = rotW;
            rc.height = rotH;
            const rctx = rc.getContext('2d');
            rctx.save();
            rctx.translate(rotW / 2, rotH / 2);
            rctx.rotate(imgRotation * Math.PI / 180);
            rctx.drawImage(originalImage, -natW / 2, -natH / 2, natW, natH);
            rctx.restore();
            return { canvas: rc, rotW, rotH };
        }

        // ----- Crop: capture the frame region at full/high resolution -----
        function performCrop() {
            if (!originalImage) {
                statusDiv.innerHTML = '⚠️ No image loaded.';
                return;
            }

            const frame = canvas._frame;
            if (!frame) {
                statusDiv.innerHTML = '⚠️ Frame not initialized.';
                return;
            }
            const { x, y, w, h } = frame;

            // Build a full-resolution version of the image with rotation baked in
            const { canvas: rotCanvas, rotW, rotH } = getRotatedSourceCanvas();

            // Figure out where the rotated image's bounding box sits on the display canvas
            const natW = originalImage.width;
            const natH = originalImage.height;
            const dispW = natW * imgScale;
            const dispH = natH * imgScale;
            const cx = imgX + dispW / 2;
            const cy = imgY + dispH / 2;
            const swapped = (imgRotation % 180) !== 0;
            const rotDispW = swapped ? dispH : dispW;
            const rotDispH = swapped ? dispW : dispH;
            const rotLeft = cx - rotDispW / 2;
            const rotTop = cy - rotDispH / 2;

            // Map the on-screen frame rectangle into the rotated source's pixel space
            const scaleFactor = rotW / rotDispW; // == 1 / imgScale
            const srcX = (x - rotLeft) * scaleFactor;
            const srcY = (y - rotTop) * scaleFactor;
            const srcW = w * scaleFactor;
            const srcH = h * scaleFactor;

            // Output size: physical print size at OUTPUT_DPI (keeps the 4:5 / 5:4 ratio)
            const outW = Math.round((isPortrait ? OUTPUT_WIDTH_IN : OUTPUT_HEIGHT_IN) * OUTPUT_DPI);
            const outH = Math.round((isPortrait ? OUTPUT_HEIGHT_IN : OUTPUT_WIDTH_IN) * OUTPUT_DPI);

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = outW;
            cropCanvas.height = outH;
            const cropCtx = cropCanvas.getContext('2d');
            cropCtx.imageSmoothingEnabled = true;
            cropCtx.imageSmoothingQuality = 'high';

            // Draw the mapped region from the full-resolution rotated source, scaled up to output size
            cropCtx.drawImage(rotCanvas, srcX, srcY, srcW, srcH, 0, 0, outW, outH);

            // Now we have the cropped image in cropCanvas.
            // We'll store it for download, and also show a preview in status.
            // We'll also enable the download button.
            window._croppedCanvas = cropCanvas;

            (async function() {
                const targetKb = parseFloat(targetKbInput.value);
                const targetBytes = (targetKb && targetKb > 0) ? targetKb * 1024 : null;

                const result = await compressPngToTarget(cropCanvas, targetBytes);
                const effectiveDpi = Math.round(OUTPUT_DPI * result.scale); // shrinks if we had to downscale
                const dpiBlob = await addDpiToPngBlob(result.blob, effectiveDpi);

                window._croppedCanvas = result.canvas;
                window._croppedBlobUrl = URL.createObjectURL(dpiBlob);

                const kbSize = (dpiBlob.size / 1024).toFixed(0);
                let msg = `✂️ Cropped! (${result.canvas.width}×${result.canvas.height} px @ ${effectiveDpi} DPI, ${kbSize} KB) — `;
                msg += `<a href="${window._croppedBlobUrl}" download="cropped_4x5.png" style="color:#4fc3f7;">preview</a> &nbsp;`;
                msg += `<span style="color:#aaa;">(click preview to view)</span>`;

                if (targetBytes && !result.hitTarget) {
                    msg += `<br><span style="font-size:13px; color:#f5a623;">⚠️ Couldn't reach ${targetKb}KB without shrinking too far — got as close as possible (${kbSize}KB).</span>`;
                }
                statusDiv.innerHTML = msg;
            })();

            downloadBtn.disabled = false;
            cropBtn.disabled = true; // prevent re-crop unless reset or reload
            statusDiv.innerHTML += `<br><span style="font-size:13px; color:#888;">💡 Click "Save as PNG" to download.</span>`;
        }

        // ----- Download cropped image as PNG -----
        function downloadCropped() {
            if (!window._croppedBlobUrl) {
                statusDiv.innerHTML = '⚠️ Nothing to download. Please crop first.';
                return;
            }

            const cropCanvas = window._croppedCanvas;
            const link = document.createElement('a');
            link.download = 'cropped_4x5.png';
            link.href = window._croppedBlobUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            fetch(window._croppedBlobUrl).then(r => r.blob()).then(b => {
                statusDiv.innerHTML = `💾 Downloaded! (${cropCanvas.width}×${cropCanvas.height} px, ${(b.size/1024).toFixed(0)} KB)`;
            });
        }

        // ----- Resize canvas to fit wrapper (responsive) -----
        function resizeCanvas() {
            // We'll keep canvas logical size fixed (600x500) but CSS will scale it.
            // The frame overlay is positioned based on logical size.
            // We need to update the frame overlay when wrapper size changes.
            // But we also want to keep the image drawn correctly.
            // We'll just call updateFrameOverlay and redraw.
            if (originalImage) {
                redraw();
                updateFrameOverlay();
            } else {
                // just draw placeholder
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#555';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Load an image to start', canvas.width/2, canvas.height/2);
                updateFrameOverlay();
            }
        }

        // ----- Mouse / Touch drag handlers -----
        function handleDragStart(e) {
            if (!originalImage) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;   // logical / CSS
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // convert to canvas logical coords
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            // check if inside canvas
            if (canvasX < 0 || canvasX > canvas.width || canvasY < 0 || canvasY > canvas.height) return;

            isDragging = true;
            dragStartX = canvasX;
            dragStartY = canvasY;
            dragStartImgX = imgX;
            dragStartImgY = imgY;

            canvas.style.cursor = 'grabbing';
        }

        function handleDragMove(e) {
            if (!isDragging || !originalImage) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches) {
                if (e.touches.length === 0) return;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            const dx = canvasX - dragStartX;
            const dy = canvasY - dragStartY;

            imgX = dragStartImgX + dx;
            imgY = dragStartImgY + dy;

            redraw();
            // frame overlay stays, no need to update
        }

        function handleDragEnd(e) {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'grab';
                // re-enable crop if image loaded
                if (originalImage) {
                    cropBtn.disabled = false;
                }
            }
        }

        // ----- Setup event listeners -----
        function init() {
            // Set canvas size
            canvas.width = 600;
            canvas.height = 500;
            canvasWidth = 600;
            canvasHeight = 500;

            // Draw placeholder
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#555';
            ctx.font = '18px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Load an image to start', canvas.width/2, canvas.height/2);

            // frame overlay initial
            updateFrameOverlay();

            // File input
            browseBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    loadImage(this.files[0]);
                }
                // reset so same file can be re-selected
                this.value = '';
            });

            // Buttons
            resetBtn.addEventListener('click', resetPosition);
            cropBtn.addEventListener('click', performCrop);
            downloadBtn.addEventListener('click', downloadCropped);
            zoomInBtn.addEventListener('click', () => zoomImage(1.1));
            zoomOutBtn.addEventListener('click', () => zoomImage(1 / 1.1));
            rotateBtn.addEventListener('click', rotateImage);
            orientationBtn.addEventListener('click', toggleOrientation);

            sizeSelector.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', () => selectSize(btn));
            });

            // Drag events (mouse)
            canvas.addEventListener('mousedown', handleDragStart);
            window.addEventListener('mousemove', handleDragMove);
            window.addEventListener('mouseup', handleDragEnd);

            // Touch events
            canvas.addEventListener('touchstart', handleDragStart, { passive: false });
            window.addEventListener('touchmove', handleDragMove, { passive: false });
            window.addEventListener('touchend', handleDragEnd);
            window.addEventListener('touchcancel', handleDragEnd);

            // Prevent context menu on canvas
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // On resize, update frame overlay (debounced)
            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    updateFrameOverlay();
                }, 200);
            });

            // Also re-apply frame when canvas size changes (but we keep fixed)
            // For any reason if frame overlay gets out of sync, we can call updateFrameOverlay
            // after a short delay. Also when image loads it's called.

            // Disable download initially
            downloadBtn.disabled = true;
            cropBtn.disabled = true;
            resetBtn.disabled = true;
            rotateBtn.disabled = true;
            orientationBtn.disabled = true;

            statusDiv.innerHTML = '📂 Click "Browse Image" to load a photo.';
        }

        // Run init
        init();
    })();
</script>

</body>
</html>
