<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TMS Calendar Builder (Offline Tool)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }

  h1 { color: #FF8C00; margin-bottom: 20px; text-align: center; }

  .topBar {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
  }

  .topBar label { font-weight: bold; font-size: 14px; }
  .topBar select, .topBar input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

  .topBar button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    color: #fff;
  }

  #saveRangeBtn { background: #FF8C00; }
  #exportBtn { background: #4CAF50; }
  #importBtn { background: #1E90FF; }

  #daysCountDisplay {
    width: 60px;
    text-align: center;
    background: #eee;
    font-weight: bold;
  }

  #rangeMsg {
    text-align: center;
    font-weight: bold;
    max-width: 900px;
    margin: 0 auto 20px auto;
    padding: 0 10px;
  }

  #previewOuter {
    display: flex;
    justify-content: center;
    padding-bottom: 250px;
  }

  #deviceSim {
    width: 390px;
    flex-shrink: 0;
    background: #fff;
    border: 3px solid #333;
    border-radius: 20px;
    transform: scale(1.4);
    transform-origin: top center;
  }

  #previewLabel {
    text-align: center;
    font-size: 11px;
    color: #FF8C00;
    font-weight: bold;
    padding: 8px 0;
    background: #FFF3E0;
  }

  #mainSim { padding: 20px; }

  #monthContentSim {
    border: 1px solid #FFDDB0;
    background: #fff8f0;
    border-radius: 12px;
    padding: 20px 14px;
    min-height: 60px;
  }

  .dateBlock {
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #FFDDB0;
  }
  .dateBlock:last-child { border-bottom: none; margin-bottom: 0; }

  .dateBlockHeader {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .dateBlockTitle {
    font-weight: bold;
    font-size: 18px;
    color: #333;
  }

  .addFieldBtn {
    background: #FF8C00;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .fieldRow { margin-top: 8px; }

  .fieldToolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .fieldToolbar button {
    border: 1px solid #FF8C00;
    background: #fff;
    color: #FF8C00;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    padding: 6px 12px;
    min-width: 36px;
  }

  .fieldToolbar button:hover { background: #FFF3E0; }

  .fieldToolbar input[type="color"] {
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    width: 40px;
    height: 34px;
    padding: 2px;
  }

  .fieldText {
    font-size: 18px;
    line-height: 1.6;
    min-height: 26px;
    border: 1px dashed #ccc;
    border-radius: 4px;
    padding: 2px 4px;
  }
  .fieldText:focus { outline: 2px solid #FF8C00; }

  .fieldActions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
    justify-content: flex-end;
  }

  .fieldActions button {
    font-size: 12px;
    padding: 5px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
    font-weight: bold;
  }

  .moveBtn { background: #757575; }
  .delBtn { background: #e53935; }

  .placeholderMsg {
    text-align: center;
    color: #999;
    font-size: 15px;
    padding: 30px 10px;
  }
</style>
</head>
<body>

  <h1>TMS Calendar Builder (Offline Tool)</h1>

  <div class="topBar">
    <label>Bengali Month:</label>
    <select id="monthSelect"></select>

    <button id="importBtn" onclick="document.getElementById('importFile').click()">Import JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJson(event)">

    <button id="exportBtn" onclick="exportJson()">Export JSON</button>
  </div>

  <div class="topBar">
    <label>Month Start (English):</label>
    <input type="date" id="monthStartInput">
    <label>Month End (English):</label>
    <input type="date" id="monthEndInput">
    <label>No. of Days:</label>
    <input type="text" id="daysCountDisplay" readonly value="-">
    <button id="saveRangeBtn" onclick="saveMonthRange()">Save</button>
  </div>

  <p id="rangeMsg"></p>

  <div id="previewOuter">
    <div id="deviceSim">
      <p id="previewLabel">Matches live mobile page exactly — text wraps the same here as on a real phone</p>
      <div id="mainSim">
        <div id="monthContentSim">
          <div id="datesContainer"><p class="placeholderMsg">Select Start and End dates above, then click Save to generate this month's dates.</p></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const bengaliMonths = ["বৈশাখ","জ্যৈষ্ঠ","আষাঢ়","শ্রাবণ","ভাদ্র","আশ্বিন","কার্তিক","অগ্রহায়ণ","পৌষ","মাঘ","ফাল্গুন","চৈত্র"];
    const bengaliMonthFiles = ['boishak','jaisthya','asharh','shrabon','bhadro','ashshin','kartik','ogrohayon','poush','magh','falgun','choitro'];
    const englishMonths = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const bengaliDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    const fontSizeSteps = [14, 16, 18, 20, 24, 28, 34, 40];

    // Approximate expected lengths — used only as a soft sanity check, real panjika lengths can vary
    const approxExpectedLengths = [31,31,31,31,31,30,30,30,30,30,30,30];

    let calendarData = {};
    let currentMonthIndex = 0;

    function toBengaliNumber(num) {
      return String(num).split('').map(function(d) {
        return /[0-9]/.test(d) ? bengaliDigits[parseInt(d)] : d;
      }).join('');
    }

    function bengaliDateSuffix(day) {
      if (day === 1) return 'লা';
      if (day === 2 || day === 3) return 'রা';
      if (day === 4) return 'ঠা';
      if (day >= 5 && day <= 18) return 'ই';
      if (day === 31) return 'লা';
      return 'শে';
    }

    function formatEnglish(date) {
      return date.getDate() + '-' + englishMonths[date.getMonth()] + '-' + date.getFullYear();
    }

    function parseDateInput(value) {
      if (!value) return null;
      const parts = value.split('-');
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }

    function populateMonthSelect() {
      const select = document.getElementById('monthSelect');
      select.innerHTML = '';
      bengaliMonths.forEach(function(name, i) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.text = name + ' (calendar-' + bengaliMonthFiles[i] + '.json)';
        select.appendChild(opt);
      });
      select.addEventListener('change', function() {
        currentMonthIndex = parseInt(select.value);
        resetForNewMonth();
      });
    }

    function resetForNewMonth() {
      calendarData = {};
      document.getElementById('monthStartInput').value = '';
      document.getElementById('monthEndInput').value = '';
      document.getElementById('daysCountDisplay').value = '-';
      document.getElementById('rangeMsg').innerText = '';
      document.getElementById('datesContainer').innerHTML = '<p class="placeholderMsg">Select Start and End dates above, then click Save to generate this month\'s dates.</p>';
    }

    function updateDaysCount() {
      const start = parseDateInput(document.getElementById('monthStartInput').value);
      const end = parseDateInput(document.getElementById('monthEndInput').value);
      const display = document.getElementById('daysCountDisplay');
      if (!start || !end || end < start) {
        display.value = '-';
        return null;
      }
      const days = Math.round((end - start) / 86400000) + 1;
      display.value = days;
      return days;
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('monthStartInput').addEventListener('change', updateDaysCount);
      document.getElementById('monthEndInput').addEventListener('change', updateDaysCount);
    });

    function saveMonthRange() {
      const start = parseDateInput(document.getElementById('monthStartInput').value);
      const end = parseDateInput(document.getElementById('monthEndInput').value);
      const msgBox = document.getElementById('rangeMsg');
      msgBox.innerText = '';

      if (!start || !end) {
        msgBox.style.color = 'red';
        msgBox.innerText = 'Please select both Start and End dates.';
        return;
      }
      if (end < start) {
        msgBox.style.color = 'red';
        msgBox.innerText = 'End date cannot be before Start date.';
        return;
      }

      const days = Math.round((end - start) / 86400000) + 1;
      const expected = approxExpectedLengths[currentMonthIndex];

      if (days !== expected) {
        const proceed = confirm(
          bengaliMonths[currentMonthIndex] + ' usually has about ' + expected + ' days, but your selected range gives ' + days + ' days.\n\n' +
          'Real panjika month lengths can vary slightly year to year, so this may be correct — but please double-check your Start/End dates.\n\n' +
          'Click OK to continue anyway, or Cancel to fix the dates.'
        );
        if (!proceed) return;
      }

      const existingLines = {};
      Object.keys(calendarData).forEach(function(d) {
        if (calendarData[d].lines && calendarData[d].lines.length > 0) {
          existingLines[d] = calendarData[d].lines;
        }
      });

      const newData = {};
      for (let d = 1; d <= days; d++) {
        const eDate = new Date(start);
        eDate.setDate(eDate.getDate() + (d - 1));
        newData[d] = {
          english: formatEnglish(eDate),
          lines: existingLines[d] || []
        };
      }
      calendarData = newData;
      msgBox.style.color = 'green';
      msgBox.innerText = 'Saved — ' + days + ' dates generated for ' + bengaliMonths[currentMonthIndex] + '.';
      renderDates();
    }

    function renderDates() {
      const container = document.getElementById('datesContainer');
      container.innerHTML = '';

      const dateKeys = Object.keys(calendarData).map(Number).sort(function(a, b) { return a - b; });

      if (dateKeys.length === 0) {
        container.innerHTML = '<p class="placeholderMsg">Select Start and End dates above, then click Save to generate this month\'s dates.</p>';
        return;
      }

      dateKeys.forEach(function(dateNum) {
        const entry = calendarData[dateNum];
        const block = document.createElement('div');
        block.className = 'dateBlock';

        const dayBn = toBengaliNumber(dateNum) + bengaliDateSuffix(dateNum);

        let fieldsHtml = '';
        entry.lines.forEach(function(lineHtml, idx) {
          fieldsHtml += renderFieldRow(dateNum, idx, lineHtml);
        });

        block.innerHTML =
          '<div class="dateBlockHeader">' +
            '<span class="dateBlockTitle">' + dayBn + ' ' + bengaliMonths[currentMonthIndex] +
              ' <span style="color:#000;">(' + entry.english + ')</span></span>' +
            '<button class="addFieldBtn" onclick="addField(' + dateNum + ')">+ Add Field</button>' +
          '</div>' +
          '<div id="fields-' + dateNum + '">' + fieldsHtml + '</div>';

        container.appendChild(block);
      });
    }

    function renderFieldRow(dateNum, idx, lineHtml) {
      const fieldId = 'field-' + dateNum + '-' + idx;
      return (
        '<div class="fieldRow">' +
          '<div class="fieldToolbar">' +
            '<button onclick="applyBold(\'' + fieldId + '\')" title="Bold"><b>B</b></button>' +
            '<button onclick="applyItalic(\'' + fieldId + '\')" title="Italic"><i>I</i></button>' +
            '<button onclick="applyFontSize(\'' + fieldId + '\', 1)" title="Bigger">A+</button>' +
            '<button onclick="applyFontSize(\'' + fieldId + '\', -1)" title="Smaller">A-</button>' +
            '<input type="color" onchange="applyColor(\'' + fieldId + '\', this.value)" title="Text Color">' +
          '</div>' +
          '<div class="fieldText" id="' + fieldId + '" contenteditable="true" oninput="syncField(' + dateNum + ',' + idx + ',\'' + fieldId + '\')">' + lineHtml + '</div>' +
          '<div class="fieldActions">' +
            '<button class="moveBtn" onclick="moveField(' + dateNum + ',' + idx + ',-1)">↑ Up</button>' +
            '<button class="moveBtn" onclick="moveField(' + dateNum + ',' + idx + ',1)">↓ Down</button>' +
            '<button class="delBtn" onclick="deleteField(' + dateNum + ',' + idx + ')">Delete</button>' +
          '</div>' +
        '</div>'
      );
    }

    function addField(dateNum) {
      calendarData[dateNum].lines.push('');
      renderDates();
      setTimeout(function() {
        const lastIdx = calendarData[dateNum].lines.length - 1;
        const el = document.getElementById('field-' + dateNum + '-' + lastIdx);
        if (el) el.focus();
      }, 50);
    }

    function deleteField(dateNum, idx) {
      calendarData[dateNum].lines.splice(idx, 1);
      renderDates();
    }

    function moveField(dateNum, idx, direction) {
      const lines = calendarData[dateNum].lines;
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= lines.length) return;
      const temp = lines[idx];
      lines[idx] = lines[newIdx];
      lines[newIdx] = temp;
      renderDates();
    }

    function syncField(dateNum, idx, fieldId) {
      const el = document.getElementById(fieldId);
      calendarData[dateNum].lines[idx] = el.innerHTML;
    }

    function getValidRange(fieldId) {
      const el = document.getElementById(fieldId);
      el.focus();
      const sel = window.getSelection();
      if (!sel.rangeCount || sel.isCollapsed) {
        alert('Please select (highlight) some text in this field first.');
        return null;
      }
      const range = sel.getRangeAt(0);
      if (!el.contains(range.commonAncestorContainer)) return null;
      return range;
    }

    function wrapSelectionWithStyle(fieldId, applyStyle) {
      const range = getValidRange(fieldId);
      if (!range) return;
      const span = document.createElement('span');
      applyStyle(span, range);
      try {
        const contents = range.extractContents();
        span.appendChild(contents);
        range.insertNode(span);
      } catch (e) {}
      const parts = fieldId.split('-');
      syncField(parts[1], parts[2], fieldId);
    }

    function applyBold(fieldId) {
      wrapSelectionWithStyle(fieldId, function(span) {
        span.style.fontWeight = 'bold';
      });
    }

    function applyItalic(fieldId) {
      wrapSelectionWithStyle(fieldId, function(span) {
        span.style.fontStyle = 'italic';
      });
    }

    function applyColor(fieldId, color) {
      wrapSelectionWithStyle(fieldId, function(span) {
        span.style.color = color;
      });
    }

    function applyFontSize(fieldId, direction) {
      const range = getValidRange(fieldId);
      if (!range) return;

      let node = range.startContainer;
      if (node.nodeType === 3) node = node.parentElement;
      const currentSize = parseInt(window.getComputedStyle(node).fontSize) || 18;

      let closestIdx = 0;
      let closestDiff = Infinity;
      fontSizeSteps.forEach(function(val, i) {
        const diff = Math.abs(val - currentSize);
        if (diff < closestDiff) { closestDiff = diff; closestIdx = i; }
      });

      let newIdx = closestIdx + direction;
      if (newIdx < 0) {
        alert('Already at the smallest size.');
        return;
      }
      if (newIdx >= fontSizeSteps.length) {
        alert('Already at the largest size.');
        return;
      }

      const newSize = fontSizeSteps[newIdx];
      const span = document.createElement('span');
      span.style.fontSize = newSize + 'px';
      const contents = range.extractContents();
      span.appendChild(contents);
      range.insertNode(span);

      const parts = fieldId.split('-');
      syncField(parts[1], parts[2], fieldId);
    }

    function exportJson() {
      const dateKeys = Object.keys(calendarData);
      if (dateKeys.length === 0) {
        alert('No dates generated yet. Select Start/End dates and click Save first.');
        return;
      }
      const output = {};
      dateKeys.forEach(function(dateNum) {
        const entry = calendarData[dateNum];
        const nonEmptyLines = entry.lines.filter(function(l) { return l && l.trim() !== ''; });
        output[dateNum] = { english: entry.english, lines: nonEmptyLines };
      });

      const filename = 'calendar-' + bengaliMonthFiles[currentMonthIndex] + '.json';
      const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function parseEnglishDateString(str) {
      const parts = str.split('-');
      if (parts.length !== 3) return null;
      const day = parseInt(parts[0]);
      const monthIdx = englishMonths.indexOf(parts[1]);
      const year = parseInt(parts[2]);
      if (isNaN(day) || monthIdx === -1 || isNaN(year)) return null;
      return new Date(year, monthIdx, day);
    }

    function importJson(event) {
      const file = event.target.files[0];
      if (!file) return;

      const filenameMatch = file.name.match(/^calendar-([a-z]+)\.json$/i);
      let detectedIndex = -1;
      if (filenameMatch) {
        detectedIndex = bengaliMonthFiles.indexOf(filenameMatch[1].toLowerCase());
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);

          if (detectedIndex !== -1) {
            currentMonthIndex = detectedIndex;
            document.getElementById('monthSelect').value = detectedIndex;
          }

          calendarData = {};
          const dateNums = Object.keys(imported).map(Number).sort(function(a, b) { return a - b; });
          dateNums.forEach(function(d) {
            calendarData[d] = {
              english: imported[d].english || '',
              lines: imported[d].lines || []
            };
          });

          if (dateNums.length > 0) {
            const firstDate = parseEnglishDateString(imported[dateNums[0]].english);
            const lastDate = parseEnglishDateString(imported[dateNums[dateNums.length - 1]].english);
            if (firstDate) {
              document.getElementById('monthStartInput').value = firstDate.toISOString().split('T')[0];
            }
            if (lastDate) {
              document.getElementById('monthEndInput').value = lastDate.toISOString().split('T')[0];
            }
            updateDaysCount();
          }

          renderDates();
          alert('Imported successfully' + (detectedIndex !== -1 ? ' — month auto-selected from filename.' : ' — please verify the correct month is selected.'));
        } catch (err) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    populateMonthSelect();
  </script>

</body>
</html>
