<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS Lyrics Mantra (Offline)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { zoom: 150%; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 15px; width: 100%; }

  header {
    background-color: #FF8C00;
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 18px;
    font-size: 18px;
    border-radius: 10px;
    margin-bottom: 15px;
    width: 100%;
  }

  .topBar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
    width: 100%;
  }

  .topBar input[type="file"] { width: 100%; }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
  }

  .btnPrimary { background-color: #FF8C00; color: #fff; }
  .btnGreen { background-color: #4CAF50; color: #fff; }
  .btnRed { background-color: #e53935; color: #fff; }
  .btnGray { background-color: #757575; color: #fff; }
  .btnBlue { background-color: #1E90FF; color: #fff; }

  .songBlock {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    width: 100%;
  }

  .songBlock label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
    margin-top: 12px;
  }

  .songBlock input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 15px;
  }

  .filenamePreview {
    font-size: 13px;
    color: #888;
    margin-top: 6px;
    word-break: break-all;
  }

  .statusMsg {
    text-align: center;
    padding: 10px;
    font-weight: bold;
    color: green;
  }

  #addSongBtn { margin-top: 15px; }

  /* ---- Mobile-width preview wrapper ---- */
  .mobilePreviewLabel {
    font-size: 13px;
    color: #888;
    margin-top: 4px;
    margin-bottom: 8px;
  }

  .mobileFrame {
    width: 430px;
    max-width: 100%;
    margin: 0 auto;
    border: 2px solid #333;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
  }

  .mobileFrameHeader {
    background-color: #FF8C00;
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 10px;
    font-size: 15px;
  }

  /* ---- Formatting toolbar ---- */
  .toolbar {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    background: #f0f0f0;
    border: 1px solid #ccc;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    padding: 6px;
    overflow-x: auto;
  }

  .toolbar button {
    width: auto;
    min-width: 32px;
    padding: 6px 7px;
    font-size: 13px;
    background: #fff;
    color: #333;
    border: 1px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .toolbar button.active {
    background: #FF8C00;
    color: #fff;
    border-color: #FF8C00;
  }

  .toolbar input[type="color"] {
    width: 30px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .toolbar input[type="number"] {
    width: 42px;
    padding: 4px 2px;
    font-size: 13px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .colorModalOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: 3000;
    align-items: center;
    justify-content: center;
  }

  .colorModalBox {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    width: 280px;
    max-width: 90%;
  }

  .colorModalBox h3 {
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
    color: #333;
  }

  .colorGrid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }

  .colorSwatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 4px;
    border: 1px solid #ccc;
    cursor: pointer;
  }

  .colorSwatch:hover {
    outline: 2px solid #333;
  }

  .recentColorsLabel {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
  }

  .recentColorsRow {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    min-height: 26px;
  }

  .customColorRow {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
  }

  .customColorRow input[type="color"] {
    width: 44px;
    height: 34px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
  }

  .colorModalBox button {
    margin-top: 6px;
  }



  #contentEditable {
    border: 1px solid #ccc;
    border-radius: 0 0 6px 6px;
    padding: 16px 10px;
    min-height: 300px;
    font-size: 20px;
    line-height: 1.8;
    outline: none;
    overflow-y: auto;
  }

  #contentEditable:empty:before {
    content: attr(data-placeholder);
    color: #aaa;
  }
</style>
</head>
<body>

  <header>TMS Lyrics Mantra (Offline)</header>

  <div class="topBar">
    <button class="btnGray" onclick="document.getElementById('importFile').click()">Import mantra's json</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJson(event)">
    <button class="btnGreen" id="saveBtn" style="display:none;" onclick="saveJson()">Save json</button>
    <button class="btnBlue" onclick="exportJson()">Export json</button>
    <button class="btnRed" onclick="clearAll()">Clear Everything</button>
  </div>

  <p id="statusMsg" class="statusMsg"></p>

  <div id="songContainer"></div>

  <button id="addSongBtn" class="btnPrimary" onclick="addSong()">+ Create New Mantra</button>

  <div class="colorModalOverlay" id="colorModalOverlay">
    <div class="colorModalBox">
      <h3>Font Color</h3>
      <div class="colorGrid" id="standardColorGrid"></div>
      <div class="recentColorsLabel">Recently used:</div>
      <div class="recentColorsRow" id="recentColorsRow"></div>
      <div class="customColorRow">
        <input type="color" id="customColorInput" value="#000000">
        <button type="button" class="btnPrimary" style="width:auto; flex:1; padding:10px;" onclick="applyCustomColor()">Apply Custom Color</button>
      </div>
      <button class="btnGray" onclick="closeColorPicker()">Close</button>
    </div>
  </div>

  <script>
    let song = null; // null = nothing added yet; otherwise { title, titleBengali, content }
    let wasImported = false;
    let savedRange = null;
    let lastSizedSpan = null;

    document.addEventListener('selectionchange', function() {
      const editable = document.getElementById('contentEditable');
      if (!editable) return;
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (!range.collapsed && editable.contains(range.commonAncestorContainer)) {
          savedRange = range.cloneRange();
          syncFontSizeInput(range);
        }
      }
    });

    function syncFontSizeInput(range) {
      const input = document.getElementById('fontSizeInput');
      if (!input) return;
      let node = range.startContainer;
      if (node.nodeType === 3) node = node.parentElement;
      const size = parseInt(window.getComputedStyle(node).fontSize, 10);
      if (size) input.value = size;
    }

    function showFakeHighlight() {
      if (!savedRange) return;
      const span = document.createElement('span');
      span.id = 'fakeHighlightSpan';
      span.style.background = '#FFD180';
      try {
        savedRange.surroundContents(span);
      } catch (e) {
        // selection spans multiple elements; skip highlight in that case
      }
    }

    function removeFakeHighlight() {
      const span = document.getElementById('fakeHighlightSpan');
      if (span) {
        const parent = span.parentNode;
        while (span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
      }
    }

    function restoreSelection() {
      if (savedRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }

    function saveDraft() {
      if (song) {
        localStorage.setItem('tms_mantra_draft', JSON.stringify({ song: song, wasImported: wasImported }));
      } else {
        localStorage.removeItem('tms_mantra_draft');
      }
    }

    function loadDraft() {
      const saved = localStorage.getItem('tms_mantra_draft');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          song = parsed.song;
          wasImported = parsed.wasImported || false;
        } catch (e) {
          song = null;
          wasImported = false;
        }
      }
      render();
    }

    function makeFilename(title) {
      return (title || '').toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render() {
      const container = document.getElementById('songContainer');
      const addBtn = document.getElementById('addSongBtn');
      const saveBtn = document.getElementById('saveBtn');
      container.innerHTML = '';

      if (!song) {
        addBtn.style.display = 'block';
        saveBtn.style.display = 'none';
        return;
      }

      addBtn.style.display = 'none';
      saveBtn.style.display = wasImported ? 'block' : 'none';

      const block = document.createElement('div');
      block.className = 'songBlock';

      let html = '<label>Title (English)</label>' +
        '<input type="text" id="titleInput" placeholder="e.g. TMS" value="' + escapeHtml(song.title) + '" onchange="updateTitle(this.value)">' +

        '<label>Title (Bengali)</label>' +
        '<input type="text" id="titleBnInput" placeholder="e.g. ঠাকুর মা স্বামীজী" value="' + escapeHtml(song.titleBengali || '') + '" onchange="updateField(\'titleBengali\', this.value)">' +

        '<div class="filenamePreview" id="filenamePreview">Will save as: ' + (makeFilename(song.title) || '(type a title first)') + '.json file format.</div>' +

        '<label>Content (mobile-width preview)</label>' +
        '<div class="mobilePreviewLabel">This box shows exactly how it will look on the phone.</div>' +

        '<div class="mobileFrame">' +
          '<div class="mobileFrameHeader" id="previewHeader">' + (escapeHtml(song.title) || 'Title') + '<br>' + (escapeHtml(song.titleBengali) || '') + '</div>' +
          '<div class="toolbar">' +
            '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(\'bold\')"><b>B</b></button>' +
            '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(\'italic\')"><i>I</i></button>' +
            '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(\'underline\')"><u>U</u></button>' +
            '<button type="button" id="colorBtn" title="Font Color" onmousedown="event.preventDefault()" onclick="openColorPicker()">A<span id="colorIndicator" style="display:block;width:16px;height:3px;background:#000;margin:2px auto 0;"></span></button>' +
            '<input type="number" id="fontSizeInput" title="Font Size" min="6" max="200" value="20" placeholder="14" onfocus="showFakeHighlight()" onchange="applyFontSize()" onkeydown="if(event.key===\'Enter\'){event.preventDefault(); applyFontSize();}">' +
            '<button type="button" onmousedown="event.preventDefault()" onclick="resizeSelection(1)">A+</button>' +
            '<button type="button" onmousedown="event.preventDefault()" onclick="resizeSelection(-1)">A-</button>' +
            '<button type="button" title="Align Left" onmousedown="event.preventDefault()" onclick="fmt(\'justifyLeft\')"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="9" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>' +
            '<button type="button" title="Align Center" onmousedown="event.preventDefault()" onclick="fmt(\'justifyCenter\')"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="3.5" y="7" width="9" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>' +
            '<button type="button" title="Align Right" onmousedown="event.preventDefault()" onclick="fmt(\'justifyRight\')"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="6" y="7" width="9" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>' +
            '<button type="button" title="Justify" onmousedown="event.preventDefault()" onclick="fmt(\'justifyFull\')"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="14" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>' +
          '</div>' +
            '<div id="contentEditable" contenteditable="true" data-placeholder="Type or paste the content here..." oninput="lastSizedSpan = null; updateContent();" onpaste="handlePaste(event)"></div>' +
        '</div>' +

        '<button class="btnRed" style="margin-top:15px;" onclick="removeSong()">Remove Mantra</button>';

      block.innerHTML = html;
      container.appendChild(block);

      const editable = document.getElementById('contentEditable');
      editable.innerHTML = song.content || '';
      document.execCommand('styleWithCSS', false, true);
    }

    function addSong() {
      song = { title: '', titleBengali: '', content: '' };
      wasImported = false;
      saveDraft();
      render();
    }

    function removeSong() {
      if (confirm('Remove this mantra from the editor? (This does not delete anything already uploaded to GitHub.)')) {
        song = null;
        wasImported = false;
        saveDraft();
        render();
      }
    }

    function updateTitle(value) {
      song.title = value;
      document.getElementById('filenamePreview').innerText = 'Will save as: ' + (makeFilename(song.title) || '(type a title first)') + '.json file format.';
      document.getElementById('previewHeader').innerHTML = (escapeHtml(song.title) || 'Title') + '<br>' + (escapeHtml(song.titleBengali) || '');
      saveDraft();
    }

    function updateField(field, value) {
      song[field] = value;
      if (field === 'titleBengali') {
        document.getElementById('previewHeader').innerHTML = (escapeHtml(song.title) || 'Title') + '<br>' + (escapeHtml(song.titleBengali) || '');
      }
      saveDraft();
    }

    function updateContent() {
      const editable = document.getElementById('contentEditable');
      song.content = editable.innerHTML;
      saveDraft();
    }

    let recentColors = [];

    const standardColors = [
      '#000000','#444444','#666666','#999999','#cccccc','#eeeeee','#f3f3f3','#ffffff',
      '#e53935','#f4511e','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#3949ab',
      '#8e24aa','#d81b60','#795548','#607d8b','#c62828','#ad1457','#4527a0','#00695c'
    ];

    function loadRecentColors() {
      const saved = localStorage.getItem('tms_recent_colors');
      if (saved) {
        try { recentColors = JSON.parse(saved); } catch (e) { recentColors = []; }
      }
    }

    function saveRecentColor(hex) {
      recentColors = recentColors.filter(function(c) { return c !== hex; });
      recentColors.unshift(hex);
      if (recentColors.length > 8) recentColors = recentColors.slice(0, 8);
      localStorage.setItem('tms_recent_colors', JSON.stringify(recentColors));
      renderRecentColors();
    }

    function renderRecentColors() {
      const row = document.getElementById('recentColorsRow');
      if (!row) return;
      if (recentColors.length === 0) {
        row.innerHTML = '<span style="font-size:12px;color:#bbb;">No recent colors yet</span>';
        return;
      }
      row.innerHTML = recentColors.map(function(c) {
        return '<div class="colorSwatch" style="background:' + c + ';" onclick="pickColor(\'' + c + '\')" title="' + c + '"></div>';
      }).join('');
    }

    function renderStandardColors() {
      const grid = document.getElementById('standardColorGrid');
      if (!grid) return;
      grid.innerHTML = standardColors.map(function(c) {
        return '<div class="colorSwatch" style="background:' + c + ';" onclick="pickColor(\'' + c + '\')" title="' + c + '"></div>';
      }).join('');
    }

    function openColorPicker() {
      renderStandardColors();
      renderRecentColors();
      document.getElementById('colorModalOverlay').style.display = 'flex';
    }

    function closeColorPicker() {
      document.getElementById('colorModalOverlay').style.display = 'none';
    }

    function pickColor(hex) {
      fmt('foreColor', hex);
      saveRecentColor(hex);
      const indicator = document.getElementById('colorIndicator');
      if (indicator) indicator.style.background = hex;
      closeColorPicker();
    }

    function applyCustomColor() {
      const hex = document.getElementById('customColorInput').value;
      pickColor(hex);
    }

    function unwrapFontSizeSpans(node) {
      let parent = node.parentElement;
      while (parent && parent.id !== 'contentEditable' && parent.tagName === 'SPAN' && parent.style.fontSize && parent.style.length === 1) {
        const grandparent = parent.parentNode;
        while (parent.firstChild) {
          grandparent.insertBefore(parent.firstChild, parent);
        }
        grandparent.removeChild(parent);
        parent = node.parentElement;
      }
    }

    function fmt(command, value) {
      const editable = document.getElementById('contentEditable');
      editable.focus();
      restoreSelection();
      document.execCommand(command, false, value || null);
      updateContent();
    }

    function resizeSelection(delta) {
      const editable = document.getElementById('contentEditable');
      editable.focus();
      restoreSelection();
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
        const current = parseInt(window.getComputedStyle(editable).fontSize, 10) || 20;
        editable.style.fontSize = (current + delta) + 'px';
        updateContent();
        return;
      }
      const range = selection.getRangeAt(0);

      if (range.startContainer.nodeType === 3 && range.startOffset > 0 && range.startOffset < range.startContainer.length) {
        range.startContainer.splitText(range.startOffset);
        range.setStart(range.startContainer.nextSibling, 0);
      }
      if (range.endContainer.nodeType === 3 && range.endOffset > 0 && range.endOffset < range.endContainer.length) {
        range.endContainer.splitText(range.endOffset);
        range.setEnd(range.endContainer, range.endContainer.length);
      }

      const walker = document.createTreeWalker(editable, NodeFilter.SHOW_TEXT, null);
      const nodesToWrap = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (range.intersectsNode(node) && node.nodeValue && node.nodeValue.length > 0) {
          nodesToWrap.push(node);
        }
      }

      let lastSpan = null;
      nodesToWrap.forEach(function(node) {
        const parent = node.parentElement;
        if (!parent) return;
        const currentSize = parseInt(window.getComputedStyle(parent).fontSize, 10) || 20;
        const newSize = Math.max(6, currentSize + delta);
        unwrapFontSizeSpans(node);
        const wrapParent = node.parentElement;
        const span = document.createElement('span');
        span.style.fontSize = newSize + 'px';
        wrapParent.replaceChild(span, node);
        span.appendChild(node);
        lastSpan = span;
      });

      if (lastSpan && nodesToWrap.length > 0) {
        const newRange = document.createRange();
        newRange.setStart(nodesToWrap[0], 0);
        newRange.setEnd(lastSpan.firstChild, lastSpan.firstChild.length);
        selection.removeAllRanges();
        selection.addRange(newRange);
        savedRange = newRange.cloneRange();
      }

      updateContent();
    }

    function handlePaste(e) {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    }

    function applyFontSize() {
      removeFakeHighlight();
      const input = document.getElementById('fontSizeInput');
      const size = parseInt(input.value, 10);
      if (!size || size < 6) return;
      const editable = document.getElementById('contentEditable');
      editable.focus();
      restoreSelection();
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
        editable.style.fontSize = size + 'px';
        updateContent();
        return;
      }
      const range = selection.getRangeAt(0);

      if (range.startContainer.nodeType === 3 && range.startOffset > 0 && range.startOffset < range.startContainer.length) {
        range.startContainer.splitText(range.startOffset);
        range.setStart(range.startContainer.nextSibling, 0);
      }
      if (range.endContainer.nodeType === 3 && range.endOffset > 0 && range.endOffset < range.endContainer.length) {
        range.endContainer.splitText(range.endOffset);
        range.setEnd(range.endContainer, range.endContainer.length);
      }

      const walker = document.createTreeWalker(editable, NodeFilter.SHOW_TEXT, null);
      const nodesToWrap = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (range.intersectsNode(node) && node.nodeValue && node.nodeValue.length > 0) {
          nodesToWrap.push(node);
        }
      }

      let lastSpan = null;
      nodesToWrap.forEach(function(node) {
        unwrapFontSizeSpans(node);
        const wrapParent = node.parentElement;
        if (!wrapParent) return;
        const span = document.createElement('span');
        span.style.fontSize = size + 'px';
        wrapParent.replaceChild(span, node);
        span.appendChild(node);
        lastSpan = span;
      });

      if (lastSpan && nodesToWrap.length > 0) {
        const newRange = document.createRange();
        newRange.setStart(nodesToWrap[0], 0);
        newRange.setEnd(lastSpan.firstChild, lastSpan.firstChild.length);
        selection.removeAllRanges();
        selection.addRange(newRange);
        savedRange = newRange.cloneRange();
      }

      updateContent();
    }

    function saveJson() {
      if (!song) return;
      saveDraft();
      const status = document.getElementById('statusMsg');
      status.innerText = 'Saved in editor. Use Export to download the updated json file.';
      setTimeout(function() { status.innerText = ''; }, 4000);
    }

    function exportJson() {
      if (!song) {
        alert('Create New or Import a mantra first.');
        return;
      }
      const filename = makeFilename(song.title);
      if (!filename) {
        alert('Please type the title first.');
        return;
      }

      const exportData = {
        title: song.title,
        titleBengali: song.titleBengali,
        content: song.content
      };

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const status = document.getElementById('statusMsg');
      status.innerText = filename + '.json downloaded! Now upload this file to your GitHub repo /mantras folder.';
      setTimeout(function() { status.innerText = ''; }, 5000);
    }

    function importJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          song = {
            title: imported.title || '',
            titleBengali: imported.titleBengali || '',
            content: imported.content || ''
          };
          wasImported = true;
          saveDraft();
          render();
          const status = document.getElementById('statusMsg');
          status.innerText = 'Imported successfully! All fields auto-filled. You can continue editing.';
          setTimeout(function() { status.innerText = ''; }, 4000);
        } catch (err) {
          alert('Could not read this file. Please make sure it is a valid mantra json file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearAll() {
      if (confirm('This will erase everything currently in the editor (not any file already uploaded to GitHub). Continue?')) {
        song = null;
        wasImported = false;
        localStorage.removeItem('tms_mantra_draft');
        render();
      }
    }

    loadRecentColors();
    loadDraft();
  </script>

</body>
</html>
