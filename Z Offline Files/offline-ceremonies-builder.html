<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TMS Ceremonies Builder (Offline Tool)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }

  h1 { color: #FF8C00; margin-bottom: 20px; text-align: center; }

  .topBar {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
  }

  .topBar label { font-weight: bold; font-size: 14px; }
  .topBar select, .topBar input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

  .topBar button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    color: #fff;
  }

  #exportBtn { background: #4CAF50; }
  #importBtn { background: #1E90FF; }

  #previewOuter {
    display: flex;
    justify-content: center;
    padding-bottom: 250px;
  }

  #deviceSim {
    width: 390px;
    flex-shrink: 0;
    background: #fff;
    border: 3px solid #333;
    border-radius: 20px;
    transform: scale(1.4);
    transform-origin: top center;
  }

  #previewLabel {
    text-align: center;
    font-size: 11px;
    color: #FF8C00;
    font-weight: bold;
    padding: 8px 0;
    background: #FFF3E0;
  }

  #mainSim { padding: 20px; }

  #monthContentSim {
    border: 1px solid #FFDDB0;
    background: #fff8f0;
    border-radius: 12px;
    padding: 20px 14px;
    min-height: 60px;
  }

  .dateBlock {
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid #FFDDB0;
  }
  .dateBlock:last-child { border-bottom: none; margin-bottom: 0; }

  .dateBlockHeader {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .dateBlockTitle {
    font-weight: bold;
    font-size: 16px;
    color: #333;
    white-space: nowrap;
  }

  .addFieldBtn {
    background: #FF8C00;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .fieldRow { margin-top: 8px; }

  .fieldToolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .fieldToolbar button {
    border: 1px solid #FF8C00;
    background: #fff;
    color: #FF8C00;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    padding: 6px 12px;
    min-width: 36px;
  }

  .fieldToolbar button:hover { background: #FFF3E0; }

  .fieldToolbar input[type="color"] {
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    width: 40px;
    height: 34px;
    padding: 2px;
  }

  .fieldText {
    font-size: 18px;
    line-height: 1.6;
    min-height: 26px;
    border: 1px dashed #ccc;
    border-radius: 4px;
    padding: 2px 4px;
  }
  .fieldText:focus { outline: 2px solid #FF8C00; }

  .fieldActions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
    justify-content: flex-end;
  }

  .fieldActions button {
    font-size: 12px;
    padding: 5px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
    font-weight: bold;
  }

  .moveBtn { background: #757575; }
  .delBtn { background: #e53935; }
</style>
</head>
<body>

  <h1>TMS Ceremonies Builder (Offline Tool)</h1>

  <div class="topBar">
    <label>Month:</label>
    <select id="monthSelect"></select>

    <label>Year:</label>
    <input type="number" id="yearInput" value="2026" style="width:90px;">

    <button id="importBtn" onclick="document.getElementById('importFile').click()">Import JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJson(event)">

    <button id="exportBtn" onclick="exportJson()">Export JSON</button>
  </div>

  <div id="previewOuter">
    <div id="deviceSim">
      <p id="previewLabel">Matches live mobile page exactly — text wraps the same here as on a real phone</p>
      <div id="mainSim">
        <div id="monthContentSim">
          <div id="datesContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const englishMonthsFull = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const englishMonthsShort = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const weekdaysFull = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const ceremonyMonthFiles = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const fontSizeSteps = [14, 16, 18, 20, 24, 28, 34, 40];

    let calendarData = {};
    let currentMonthIndex = 0;

    function daysInMonth(monthIndex, year) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    function formatEnglish(date) {
      return date.getDate() + '-' + englishMonthsShort[date.getMonth()] + '-' + date.getFullYear();
    }

    function populateMonthSelect() {
      const select = document.getElementById('monthSelect');
      select.innerHTML = '';
      englishMonthsFull.forEach(function(name, i) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.text = name + ' (ceremonies-' + ceremonyMonthFiles[i] + '.json)';
        select.appendChild(opt);
      });
      select.addEventListener('change', function() {
        currentMonthIndex = parseInt(select.value);
        buildDateSkeleton();
      });
      document.getElementById('yearInput').addEventListener('change', buildDateSkeleton);
    }

    function buildDateSkeleton() {
      const year = parseInt(document.getElementById('yearInput').value) || 2026;
      const numDays = daysInMonth(currentMonthIndex, year);

      const newData = {};
      for (let d = 1; d <= numDays; d++) {
        const eDate = new Date(year, currentMonthIndex, d);
        const existing = calendarData[d];
        newData[d] = {
          english: formatEnglish(eDate),
          weekday: weekdaysFull[eDate.getDay()],
          lines: existing ? existing.lines : []
        };
      }
      calendarData = newData;
      renderDates();
    }

    function renderDates() {
      const container = document.getElementById('datesContainer');
      container.innerHTML = '';

      const dateKeys = Object.keys(calendarData).map(Number).sort(function(a, b) { return a - b; });

      dateKeys.forEach(function(dateNum) {
        const entry = calendarData[dateNum];
        const block = document.createElement('div');
        block.className = 'dateBlock';

        let fieldsHtml = '';
        entry.lines.forEach(function(lineHtml, idx) {
          fieldsHtml += renderFieldRow(dateNum, idx, lineHtml);
        });

        block.innerHTML =
          '<div class="dateBlockHeader">' +
            '<span class="dateBlockTitle">' + entry.english + ', ' + entry.weekday + '</span>' +
            '<button class="addFieldBtn" onclick="addField(' + dateNum + ')">+ Add Line</button>' +
          '</div>' +
          '<div id="fields-' + dateNum + '">' + fieldsHtml + '</div>';

        container.appendChild(block);
      });
    }

    function renderFieldRow(dateNum, idx, lineHtml) {
      const fieldId = 'field-' + dateNum + '-' + idx;
      return (
        '<div class="fieldRow">' +
          '<div class="fieldToolbar">' +
            '<button onclick="applyBold(\'' + fieldId + '\')" title="Bold"><b>B</b></button>' +
            '<button onclick="applyItalic(\'' + fieldId + '\')" title="Italic"><i>I</i></button>' +
            '<button onclick="applyFontSize(\'' + fieldId + '\', 1)" title="Bigger">A+</button>' +
            '<button onclick="applyFontSize(\'' + fieldId + '\', -1)" title="Smaller">A-</button>' +
            '<input type="color" onchange="applyColor(\'' + fieldId + '\', this.value)" title="Text Color">' +
          '</div>' +
          '<div class="fieldText" id="' + fieldId + '" contenteditable="true" oninput="syncField(' + dateNum + ',' + idx + ',\'' + fieldId + '\')">' + lineHtml + '</div>' +
          '<div class="fieldActions">' +
            '<button class="moveBtn" onclick="moveField(' + dateNum + ',' + idx + ',-1)">↑ Up</button>' +
            '<button class="moveBtn" onclick="moveField(' + dateNum + ',' + idx + ',1)">↓ Down</button>' +
            '<button class="delBtn" onclick="deleteField(' + dateNum + ',' + idx + ')">Delete</button>' +
          '</div>' +
        '</div>'
      );
    }

    function addField(dateNum) {
      calendarData[dateNum].lines.push('');
      renderDates();
      setTimeout(function() {
        const lastIdx = calendarData[dateNum].lines.length - 1;
        const el = document.getElementById('field-' + dateNum + '-' + lastIdx);
        if (el) el.focus();
      }, 50);
    }

    function deleteField(dateNum, idx) {
      calendarData[dateNum].lines.splice(idx, 1);
      renderDates();
    }

    function moveField(dateNum, idx, direction) {
      const lines = calendarData[dateNum].lines;
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= lines.length) return;
      const temp = lines[idx];
      lines[idx] = lines[newIdx];
      lines[newIdx] = temp;
      renderDates();
    }

    function syncField(dateNum, idx, fieldId) {
      const el = document.getElementById(fieldId);
      calendarData[dateNum].lines[idx] = el.innerHTML;
    }

    function getValidRange(fieldId) {
      const el = document.getElementById(fieldId);
      el.focus();
      const sel = window.getSelection();
      if (!sel.rangeCount || sel.isCollapsed) {
        alert('Please select (highlight) some text in this field first.');
        return null;
      }
      const range = sel.getRangeAt(0);
      if (!el.contains(range.commonAncestorContainer)) return null;
      return range;
    }

    function wrapSelectionWithStyle(fieldId, applyStyle) {
      const range = getValidRange(fieldId);
      if (!range) return;
      const span = document.createElement('span');
      applyStyle(span, range);
      try {
        const contents = range.extractContents();
        span.appendChild(contents);
        range.insertNode(span);
      } catch (e) {}
      const parts = fieldId.split('-');
      syncField(parts[1], parts[2], fieldId);
    }

    function applyBold(fieldId) {
      wrapSelectionWithStyle(fieldId, function(span) {
        span.style.fontWeight = 'bold';
      });
    }

    function applyItalic(fieldId) {
      wrapSelectionWithStyle(fieldId, function(span) {
        span.style.fontStyle = 'italic';
      });
    }

    function applyColor(fieldId, color) {
      wrapSelectionWithStyle(fieldId, function(span) {
        span.style.color = color;
      });
    }

    function applyFontSize(fieldId, direction) {
      const range = getValidRange(fieldId);
      if (!range) return;

      let node = range.startContainer;
      if (node.nodeType === 3) node = node.parentElement;
      const currentSize = parseInt(window.getComputedStyle(node).fontSize) || 18;

      let closestIdx = 0;
      let closestDiff = Infinity;
      fontSizeSteps.forEach(function(val, i) {
        const diff = Math.abs(val - currentSize);
        if (diff < closestDiff) { closestDiff = diff; closestIdx = i; }
      });

      let newIdx = closestIdx + direction;
      if (newIdx < 0) {
        alert('Already at the smallest size.');
        return;
      }
      if (newIdx >= fontSizeSteps.length) {
        alert('Already at the largest size.');
        return;
      }

      const newSize = fontSizeSteps[newIdx];
      const span = document.createElement('span');
      span.style.fontSize = newSize + 'px';
      const contents = range.extractContents();
      span.appendChild(contents);
      range.insertNode(span);

      const parts = fieldId.split('-');
      syncField(parts[1], parts[2], fieldId);
    }

    function exportJson() {
      const dateKeys = Object.keys(calendarData);
      const output = {};
      dateKeys.forEach(function(dateNum) {
        const entry = calendarData[dateNum];
        const nonEmptyLines = entry.lines.filter(function(l) { return l && l.trim() !== ''; });
        output[dateNum] = { english: entry.english, weekday: entry.weekday, lines: nonEmptyLines };
      });

      const filename = 'ceremonies-' + ceremonyMonthFiles[currentMonthIndex] + '.json';
      const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importJson(event) {
      const file = event.target.files[0];
      if (!file) return;

      const filenameMatch = file.name.match(/^ceremonies-([a-z]+)\.json$/i);
      let detectedIndex = -1;
      if (filenameMatch) {
        detectedIndex = ceremonyMonthFiles.indexOf(filenameMatch[1].toLowerCase());
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);

          if (detectedIndex !== -1) {
            currentMonthIndex = detectedIndex;
            document.getElementById('monthSelect').value = detectedIndex;
            calendarData = {};
            buildDateSkeleton();
          } else {
            alert('Could not detect month from filename. Please make sure the correct month is selected before importing.');
          }

          Object.keys(imported).forEach(function(dateNum) {
            if (calendarData[dateNum]) {
              calendarData[dateNum].lines = imported[dateNum].lines || [];
            }
          });
          renderDates();
          alert('Imported successfully' + (detectedIndex !== -1 ? ' — month auto-selected from filename.' : '.'));
        } catch (err) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    populateMonthSelect();
    buildDateSkeleton();
  </script>

</body>
</html>
