<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS Offline Daily Quote Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { zoom: 150%; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 15px; width: 100%; }

  header {
    background-color: #FF8C00;
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 18px;
    font-size: 18px;
    border-radius: 10px;
    margin-bottom: 15px;
    width: 100%;
  }

  .topBar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
    width: 100%;
  }

  .topBar input[type="file"] { width: 100%; }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
  }

  .btnPrimary { background-color: #FF8C00; color: #fff; }
  .btnGreen { background-color: #4CAF50; color: #fff; }
  .btnRed { background-color: #e53935; color: #fff; }
  .btnGray { background-color: #757575; color: #fff; }
  .btnBlue { background-color: #1E90FF; color: #fff; }

  .personBlock {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    width: 100%;
    margin-bottom: 15px;
  }

  .personBlock label, .songBlock label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
    margin-top: 12px;
  }

  .personBlock label:first-child { margin-top: 0; }

  .personBlock input, .songBlock input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 15px;
  }

  .filenamePreview {
    font-size: 13px;
    color: #888;
    margin-top: 6px;
    word-break: break-all;
  }

  .statusMsg {
    text-align: center;
    padding: 10px;
    font-weight: bold;
    color: green;
  }

  #addQuoteBtn { margin-top: 5px; margin-bottom: 15px; }

  .songBlock {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    width: 100%;
    margin-bottom: 15px;
  }

  .serialLabel {
    display: inline-block;
    background: #FF8C00;
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  /* ---- Mobile-width preview wrapper ---- */
  .mobilePreviewLabel {
    font-size: 13px;
    color: #888;
    margin-top: 4px;
    margin-bottom: 8px;
  }

  .mobileFrame {
    width: 430px;
    max-width: 100%;
    margin: 0 auto;
    border: 2px solid #333;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
  }

  .mobileFrameHeader {
    background-color: #FF8C00;
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 10px;
    font-size: 15px;
  }

  /* ---- Formatting toolbar ---- */
  .toolbar {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    background: #f0f0f0;
    border: 1px solid #ccc;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    padding: 6px;
    overflow-x: auto;
  }

  .toolbar button {
    width: auto;
    min-width: 32px;
    padding: 6px 7px;
    font-size: 13px;
    background: #fff;
    color: #333;
    border: 1px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .toolbar input[type="number"] {
    width: 42px;
    padding: 4px 2px;
    font-size: 13px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .colorModalOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: 3000;
    align-items: center;
    justify-content: center;
  }

  .colorModalBox {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    width: 280px;
    max-width: 90%;
  }

  .colorModalBox h3 {
    font-size: 16px;
    margin-bottom: 14px;
    text-align: center;
    color: #333;
  }

  .colorGrid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }

  .colorSwatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 4px;
    border: 1px solid #ccc;
    cursor: pointer;
  }

  .colorSwatch:hover {
    outline: 2px solid #333;
  }

  .recentColorsLabel {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
  }

  .recentColorsRow {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    min-height: 26px;
  }

  .customColorRow {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
  }

  .customColorRow input[type="color"] {
    width: 44px;
    height: 34px;
    padding: 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
  }

  .colorModalBox button {
    margin-top: 6px;
  }

  .contentEditable {
    border: 1px solid #ccc;
    border-radius: 0 0 6px 6px;
    padding: 16px 10px;
    min-height: 200px;
    font-size: 20px;
    line-height: 1.8;
    outline: none;
    overflow-y: auto;
  }

  .contentEditable:empty:before {
    content: attr(data-placeholder);
    color: #aaa;
  }

  .emptyMsg {
    text-align: center;
    color: #888;
    padding: 20px;
    font-weight: bold;
  }
</style>
</head>
<body>

  <header>TMS Offline Daily Quote Editor</header>

  <div class="topBar">
    <button class="btnGray" onclick="document.getElementById('importFile').click()">Import daily quote json</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJson(event)">
    <button class="btnBlue" onclick="exportJson()">Export json</button>
    <button class="btnRed" onclick="clearAll()">Clear Everything</button>
  </div>

  <p id="statusMsg" class="statusMsg"></p>

  <div class="personBlock">
    <label>Name (English)</label>
    <input type="text" id="nameInput" placeholder="e.g. Thakur Sri Ramakrishna" value="" oninput="updatePersonField('name', this.value)">

    <label>Name (Bengali)</label>
    <input type="text" id="nameBnInput" placeholder="e.g. ঠাকুর শ্রী রামকৃষ্ণ" value="" oninput="updatePersonField('nameBengali', this.value)">

    <label>Initials</label>
    <input type="text" id="initialsInput" placeholder="e.g. TSR" value="" oninput="updatePersonField('initials', this.value)">

    <div class="filenamePreview" id="filenamePreview">Will save as: (type a name first).json file format.</div>
  </div>

  <button id="addQuoteBtn" class="btnPrimary" onclick="addQuote()">+ Add New Daily Quote</button>

  <div id="quoteContainer"></div>

  <div class="colorModalOverlay" id="colorModalOverlay">
    <div class="colorModalBox">
      <h3>Font Color</h3>
      <div class="colorGrid" id="standardColorGrid"></div>
      <div class="recentColorsLabel">Recently used:</div>
      <div class="recentColorsRow" id="recentColorsRow"></div>
      <div class="customColorRow">
        <input type="color" id="customColorInput" value="#000000">
        <button type="button" class="btnPrimary" style="width:auto; flex:1; padding:10px;" onclick="applyCustomColor()">Apply Custom Color</button>
      </div>
      <button class="btnGray" onclick="closeColorPicker()">Close</button>
    </div>
  </div>

  <script>
    // person = { name, nameBengali, initials }
    // quotes = array of { serial, content }, always kept sorted DESCENDING by serial (newest/highest on top)
    let person = { name: '', nameBengali: '', initials: '' };
    let quotes = [];
    let savedRanges = {};       // serial -> Range
    let colorPickerTargetSerial = null;

    // ---------- storage / draft ----------
    function saveDraft() {
      localStorage.setItem('tms_daily_quote_draft', JSON.stringify({ person: person, quotes: quotes }));
    }

    function loadDraft() {
      const saved = localStorage.getItem('tms_daily_quote_draft');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          person = parsed.person || { name: '', nameBengali: '', initials: '' };
          quotes = parsed.quotes || [];
        } catch (e) {
          person = { name: '', nameBengali: '', initials: '' };
          quotes = [];
        }
      }
      renderPersonFields();
      renderQuotes();
    }

    function makeFilename(name) {
      return (name || '').toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---------- person fields ----------
    function renderPersonFields() {
      document.getElementById('nameInput').value = person.name || '';
      document.getElementById('nameBnInput').value = person.nameBengali || '';
      document.getElementById('initialsInput').value = person.initials || '';
      updateFilenamePreview();
      updateAllMobileHeaders();
    }

    function updatePersonField(field, value) {
      person[field] = value;
      updateFilenamePreview();
      updateAllMobileHeaders();
      saveDraft();
    }

    function updateFilenamePreview() {
      document.getElementById('filenamePreview').innerText =
        'Will save as: ' + (makeFilename(person.name) || '(type a name first)') + '.json file format.';
    }

    function updateAllMobileHeaders() {
      quotes.forEach(function(q) {
        const header = document.getElementById('previewHeader-' + q.serial);
        if (header) {
          header.innerHTML = (escapeHtml(person.name) || 'Name') + '<br>' + (escapeHtml(person.nameBengali) || '');
        }
      });
    }

    // ---------- quotes ----------
    function getNextSerial() {
      if (quotes.length === 0) return 1;
      return Math.max.apply(null, quotes.map(function(q) { return q.serial; })) + 1;
    }

    function addQuote() {
      const newQuote = { serial: getNextSerial(), content: '' };
      quotes.unshift(newQuote); // newest on top
      saveDraft();
      renderQuotes();
    }

    function removeQuote(serial) {
      if (confirm('Remove Quote #' + serial + ' from the editor? (This does not delete anything already uploaded to GitHub.)')) {
        quotes = quotes.filter(function(q) { return q.serial !== serial; });
        delete savedRanges[serial];
        saveDraft();
        renderQuotes();
      }
    }

    function updateContent(serial) {
      const editable = document.getElementById('editable-' + serial);
      const q = quotes.find(function(q) { return q.serial === serial; });
      if (q && editable) {
        q.content = editable.innerHTML;
        saveDraft();
      }
    }

    function renderQuotes() {
      const container = document.getElementById('quoteContainer');
      container.innerHTML = '';

      if (quotes.length === 0) {
        container.innerHTML = '<p class="emptyMsg">No quotes added yet. Click "+ Add New Daily Quote" above.</p>';
        return;
      }

      quotes.forEach(function(q) {
        const block = document.createElement('div');
        block.className = 'songBlock';

        block.innerHTML =
          '<span class="serialLabel">Quote #' + q.serial + '</span>' +
          '<div class="mobilePreviewLabel">This box shows exactly how it will look on the phone.</div>' +
          '<div class="mobileFrame">' +
            '<div class="mobileFrameHeader" id="previewHeader-' + q.serial + '">' +
              (escapeHtml(person.name) || 'Name') + '<br>' + (escapeHtml(person.nameBengali) || '') +
            '</div>' +
            '<div class="toolbar">' +
              '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(' + q.serial + ', \'bold\')"><b>B</b></button>' +
              '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(' + q.serial + ', \'italic\')"><i>I</i></button>' +
              '<button type="button" onmousedown="event.preventDefault()" onclick="fmt(' + q.serial + ', \'underline\')"><u>U</u></button>' +
              '<button type="button" title="Font Color" onmousedown="event.preventDefault()" onclick="openColorPicker(' + q.serial + ')">A<span id="colorIndicator-' + q.serial + '" style="display:block;width:16px;height:3px;background:#000;margin:2px auto 0;"></span></button>' +
              '<input type="number" id="fontSizeInput-' + q.serial + '" title="Font Size" min="6" max="200" value="20" placeholder="14" onfocus="showFakeHighlight(' + q.serial + ')" onchange="applyFontSize(' + q.serial + ')" onkeydown="if(event.key===\'Enter\'){event.preventDefault(); applyFontSize(' + q.serial + ');}">' +
              '<button type="button" onmousedown="event.preventDefault()" onclick="resizeSelection(' + q.serial + ', 1)">A+</button>' +
              '<button type="button" onmousedown="event.preventDefault()" onclick="resizeSelection(' + q.serial + ', -1)">A-</button>' +
              '<button type="button" title="Align Left" onmousedown="event.preventDefault()" onclick="fmt(' + q.serial + ', \'justifyLeft\')"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="9" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>' +
              '<button type="button" title="Align Center" onmousedown="event.preventDefault()" onclick="fmt(' + q.serial + ', \'justifyCenter\')"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="3.5" y="7" width="9" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>' +
              '<button type="button" title="Align Right" onmousedown="event.preventDefault()" onclick="fmt(' + q.serial + ', \'justifyRight\')"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="6" y="7" width="9" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>' +
              '<button type="button" title="Justify" onmousedown="event.preventDefault()" onclick="fmt(' + q.serial + ', \'justifyFull\')"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="14" height="2"/><rect x="1" y="12" width="14" height="2"/></svg></button>' +
            '</div>' +
            '<div id="editable-' + q.serial + '" class="contentEditable" contenteditable="true" data-placeholder="Type or paste this quote here..." oninput="updateContent(' + q.serial + ')" onpaste="handlePaste(event, ' + q.serial + ')"></div>' +
          '</div>' +
          '<button class="btnRed" style="margin-top:15px;" onclick="removeQuote(' + q.serial + ')">Remove This Quote</button>';

        container.appendChild(block);

        const editable = block.querySelector('#editable-' + q.serial);
        editable.innerHTML = q.content || '';
      });

      document.execCommand('styleWithCSS', false, true);
    }

    // ---------- selection tracking (per-quote) ----------
    document.addEventListener('selectionchange', function() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      let node = range.commonAncestorContainer;
      if (node.nodeType === 3) node = node.parentElement;
      const editableEl = node ? node.closest('.contentEditable') : null;
      if (!editableEl) return;
      const serial = parseInt(editableEl.id.replace('editable-', ''), 10);
      if (!range.collapsed) {
        savedRanges[serial] = range.cloneRange();
        syncFontSizeInput(serial, range);
      }
    });

    function syncFontSizeInput(serial, range) {
      const input = document.getElementById('fontSizeInput-' + serial);
      if (!input) return;
      let node = range.startContainer;
      if (node.nodeType === 3) node = node.parentElement;
      const size = parseInt(window.getComputedStyle(node).fontSize, 10);
      if (size) input.value = size;
    }

    function showFakeHighlight(serial) {
      // placeholder hook kept for parity; no visual highlight needed since selection is preserved via savedRanges
    }

    function restoreSelection(serial) {
      if (savedRanges[serial]) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRanges[serial]);
      }
    }

    // ---------- formatting ----------
    function fmt(serial, command, value) {
      const editable = document.getElementById('editable-' + serial);
      editable.focus();
      restoreSelection(serial);
      document.execCommand(command, false, value || null);
      updateContent(serial);
    }

    function unwrapFontSizeSpans(node) {
      let parent = node.parentElement;
      while (parent && !parent.classList.contains('contentEditable') && parent.tagName === 'SPAN' && parent.style.fontSize && parent.style.length === 1) {
        const grandparent = parent.parentNode;
        while (parent.firstChild) {
          grandparent.insertBefore(parent.firstChild, parent);
        }
        grandparent.removeChild(parent);
        parent = node.parentElement;
      }
    }

    function resizeSelection(serial, delta) {
      const editable = document.getElementById('editable-' + serial);
      editable.focus();
      restoreSelection(serial);
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
        const current = parseInt(window.getComputedStyle(editable).fontSize, 10) || 20;
        editable.style.fontSize = (current + delta) + 'px';
        updateContent(serial);
        return;
      }
      applySizeToSelection(serial, selection, function(currentSize) { return Math.max(6, currentSize + delta); });
    }

    function applyFontSize(serial) {
      const input = document.getElementById('fontSizeInput-' + serial);
      const size = parseInt(input.value, 10);
      if (!size || size < 6) return;
      const editable = document.getElementById('editable-' + serial);
      editable.focus();
      restoreSelection(serial);
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
        editable.style.fontSize = size + 'px';
        updateContent(serial);
        return;
      }
      applySizeToSelection(serial, selection, function() { return size; });
    }

    function applySizeToSelection(serial, selection, computeSize) {
      const editable = document.getElementById('editable-' + serial);
      const range = selection.getRangeAt(0);

      if (range.startContainer.nodeType === 3 && range.startOffset > 0 && range.startOffset < range.startContainer.length) {
        range.startContainer.splitText(range.startOffset);
        range.setStart(range.startContainer.nextSibling, 0);
      }
      if (range.endContainer.nodeType === 3 && range.endOffset > 0 && range.endOffset < range.endContainer.length) {
        range.endContainer.splitText(range.endOffset);
        range.setEnd(range.endContainer, range.endContainer.length);
      }

      const walker = document.createTreeWalker(editable, NodeFilter.SHOW_TEXT, null);
      const nodesToWrap = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (range.intersectsNode(node) && node.nodeValue && node.nodeValue.length > 0) {
          nodesToWrap.push(node);
        }
      }

      let lastSpan = null;
      nodesToWrap.forEach(function(node) {
        const parent = node.parentElement;
        if (!parent) return;
        const currentSize = parseInt(window.getComputedStyle(parent).fontSize, 10) || 20;
        const newSize = computeSize(currentSize);
        unwrapFontSizeSpans(node);
        const wrapParent = node.parentElement;
        const span = document.createElement('span');
        span.style.fontSize = newSize + 'px';
        wrapParent.replaceChild(span, node);
        span.appendChild(node);
        lastSpan = span;
      });

      if (lastSpan && nodesToWrap.length > 0) {
        const newRange = document.createRange();
        newRange.setStart(nodesToWrap[0], 0);
        newRange.setEnd(lastSpan.firstChild, lastSpan.firstChild.length);
        selection.removeAllRanges();
        selection.addRange(newRange);
        savedRanges[serial] = newRange.cloneRange();
      }

      updateContent(serial);
    }

    function handlePaste(e, serial) {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
      updateContent(serial);
    }

    // ---------- color picker (shared modal) ----------
    let recentColors = [];

    const standardColors = [
      '#000000','#444444','#666666','#999999','#cccccc','#eeeeee','#f3f3f3','#ffffff',
      '#e53935','#f4511e','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#3949ab',
      '#8e24aa','#d81b60','#795548','#607d8b','#c62828','#ad1457','#4527a0','#00695c'
    ];

    function loadRecentColors() {
      const saved = localStorage.getItem('tms_recent_colors');
      if (saved) {
        try { recentColors = JSON.parse(saved); } catch (e) { recentColors = []; }
      }
    }

    function saveRecentColor(hex) {
      recentColors = recentColors.filter(function(c) { return c !== hex; });
      recentColors.unshift(hex);
      if (recentColors.length > 8) recentColors = recentColors.slice(0, 8);
      localStorage.setItem('tms_recent_colors', JSON.stringify(recentColors));
      renderRecentColors();
    }

    function renderRecentColors() {
      const row = document.getElementById('recentColorsRow');
      if (!row) return;
      if (recentColors.length === 0) {
        row.innerHTML = '<span style="font-size:12px;color:#bbb;">No recent colors yet</span>';
        return;
      }
      row.innerHTML = recentColors.map(function(c) {
        return '<div class="colorSwatch" style="background:' + c + ';" onclick="pickColor(\'' + c + '\')" title="' + c + '"></div>';
      }).join('');
    }

    function renderStandardColors() {
      const grid = document.getElementById('standardColorGrid');
      if (!grid) return;
      grid.innerHTML = standardColors.map(function(c) {
        return '<div class="colorSwatch" style="background:' + c + ';" onclick="pickColor(\'' + c + '\')" title="' + c + '"></div>';
      }).join('');
    }

    function openColorPicker(serial) {
      colorPickerTargetSerial = serial;
      renderStandardColors();
      renderRecentColors();
      document.getElementById('colorModalOverlay').style.display = 'flex';
    }

    function closeColorPicker() {
      document.getElementById('colorModalOverlay').style.display = 'none';
    }

    function pickColor(hex) {
      if (colorPickerTargetSerial === null) return;
      fmt(colorPickerTargetSerial, 'foreColor', hex);
      saveRecentColor(hex);
      const indicator = document.getElementById('colorIndicator-' + colorPickerTargetSerial);
      if (indicator) indicator.style.background = hex;
      closeColorPicker();
    }

    function applyCustomColor() {
      const hex = document.getElementById('customColorInput').value;
      pickColor(hex);
    }

    // ---------- export / import / clear ----------
    function exportJson() {
      if (!person.name || !makeFilename(person.name)) {
        alert('Please type the Name (English) first.');
        return;
      }
      if (quotes.length === 0) {
        alert('Please add at least one quote first.');
        return;
      }

      const sortedAscending = quotes.slice().sort(function(a, b) { return a.serial - b.serial; });

      const exportData = {
        name: person.name,
        nameBengali: person.nameBengali,
        initials: person.initials,
        quotes: sortedAscending.map(function(q) {
          return { serial: q.serial, text: q.content };
        })
      };

      const filename = makeFilename(person.name);
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const status = document.getElementById('statusMsg');
      status.innerText = filename + '.json downloaded! Now upload this file to your GitHub repo /tms-daily-quotes folder.';
      setTimeout(function() { status.innerText = ''; }, 5000);
    }

    function importJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          person = {
            name: imported.name || '',
            nameBengali: imported.nameBengali || '',
            initials: imported.initials || ''
          };
          const importedQuotes = (imported.quotes || []).map(function(q) {
            return { serial: q.serial, content: q.text || '' };
          });
          // display order: highest serial on top
          importedQuotes.sort(function(a, b) { return b.serial - a.serial; });
          quotes = importedQuotes;

          saveDraft();
          renderPersonFields();
          renderQuotes();
          const status = document.getElementById('statusMsg');
          status.innerText = 'Imported successfully! All fields and quotes auto-filled. You can continue editing.';
          setTimeout(function() { status.innerText = ''; }, 4000);
        } catch (err) {
          alert('Could not read this file. Please make sure it is a valid daily quote json file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearAll() {
      if (confirm('This will erase everything currently in the editor (not any file already uploaded to GitHub). Continue?')) {
        person = { name: '', nameBengali: '', initials: '' };
        quotes = [];
        savedRanges = {};
        localStorage.removeItem('tms_daily_quote_draft');
        renderPersonFields();
        renderQuotes();
      }
    }

    loadRecentColors();
    loadDraft();
  </script>

</body>
</html>
